<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: auralis-artwork:; media-src 'self' auralis-audio:; connect-src 'self' auralis-audio: auralis-artwork:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auralis</title>
    <link rel="stylesheet" href="/splash/splash.css" />
    <script src="/splash/theme-boot.js"></script>
  </head>
  <body>
    <!-- 开屏退场前主界面保持 inert；控制器退场后解除并交还焦点。 -->
    <div id="app" inert tabindex="-1"></div>
    <!-- 开屏节点独立于 Vue：viewBox 与应用图标波形一致，光点由控制器沿真实曲线驱动。 -->
    <div id="splash" role="img" aria-label="Auralis">
      <div id="splash-figure" aria-hidden="true">
        <svg
          id="splash-mark"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
          focusable="false"
        >
          <path
            id="splash-waveform-path"
            d="M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2"
          />
          <circle id="splash-dot" cx="2" cy="13" r="1.3" />
        </svg>
        <span id="splash-brand">Auralis</span>
      </div>
    </div>
    <script type="module" src="/main.ts"></script>
    <script type="module" src="/app/splash/splashController.ts"></script>
  </body>
</html>
