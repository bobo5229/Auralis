<div class="archive-mac-shell" id="archive-mac-shell" data-scene="intro">
  <div class="archive-galaxy-glow" aria-hidden="true"></div>
  <canvas class="archive-stars" id="archive-stars" aria-hidden="true"></canvas>
  <main class="archive-mac-main">
    <div class="scene" id="scene">
      <div class="studio" id="studio">
        <div
          class="rig"
          id="rig"
          role="button"
          tabindex="0"
          data-i18n-aria="archive.mac.enter"
          aria-label="进入声迹。双击或按 Enter、空格。"
        >
          <div class="mac" data-i18n-aria="archive.mac.model" aria-label="大屏 Macintosh 概念模型">
            <div class="face front">
              <div class="crt-well">
                <div class="crt-glass">
                  <canvas id="crt" width="512" height="544"></canvas>
                  <div class="scan"></div>
                  <div class="glare"></div>

                  <!-- Logical 512x544 CRT plane for the taller screen -->
                  <div class="crt-logic-plane" id="crt-logic-plane">
                    <!-- Top Menu Bar -->
                    <div class="crt-menu-bar">
                      <div class="crt-menu-items">
                        <span class="crt-menu-apple" aria-hidden="true"
                          ><svg viewBox="0 0 18 22" width="12" height="16" aria-hidden="true">
                            <path
                              fill="currentColor"
                              d="M13.2 6.1c-.8.9-2.1 1.6-3.3 1.5-.2-1.2.4-2.5 1.1-3.3.8-.9 2.2-1.6 3.3-1.6.1 1.3-.4 2.5-1.1 3.4zM16.3 16.4c-.7 1.1-1.4 2.2-2.5 2.2-1.1.1-1.4-.7-2.9-.7s-1.9.7-2.9.7c-1.1 0-1.9-1-2.6-2.1-1.4-2.2-2.5-6.2-1-8.3.7-1.1 1.9-1.8 3.2-1.8 1 0 1.9.7 2.6.7s1.8-.8 3.1-.7c.5 0 2 .2 3 1.6-2.6 1.5-2.2 5.3.2 6.4z"
                            /></svg
                        ></span>
                        <span>File</span>
                        <span>Edit</span>
                        <span>View</span>
                        <span>Special</span>
                      </div>
                      <div class="crt-clock" id="crt-clock">12:00</div>
                    </div>

                    <section
                      class="crt-preview"
                      id="crt-record"
                      data-loaded="false"
                      data-i18n-aria="archive.mac.loadedAlbum"
                      aria-label="已载入专辑"
                      aria-live="polite"
                      aria-atomic="true"
                    >
                      <div class="crt-record-date" id="crt-record-date"></div>
                      <div class="crt-idle">
                        <strong data-i18n="archive.title">声迹</strong
                        ><span data-i18n="archive.mac.noDisk">未载入软盘</span>
                      </div>
                      <div class="crt-record-content">
                        <div class="crt-record-heading">
                          <div class="crt-preview-art" id="crt-preview-art"></div>
                          <div class="crt-record-text">
                            <h2 id="crt-preview-title"></h2>
                            <p id="crt-preview-artist"></p>
                          </div>
                        </div>
                        <dl class="crt-record-stats">
                          <div>
                            <dt data-i18n="archive.mac.plays">播放次数</dt>
                            <dd id="crt-record-plays"></dd>
                          </div>
                          <div>
                            <dt data-i18n="archive.mac.duration">聆听时长</dt>
                            <dd id="crt-record-duration"></dd>
                          </div>
                        </dl>
                      </div>
                    </section>
                  </div>
                </div>
              </div>
              <div class="heritage-mark" aria-hidden="true"><span>a</span></div>
              <div class="floppy" aria-hidden="true"></div>
              <span class="drive-led" aria-hidden="true"></span>
              <span class="hardware-name">Macintosh<span>PERSONAL COMPUTER / 128K</span></span>
              <span class="dial" aria-hidden="true"></span>
              <span class="shell-foot" aria-hidden="true"></span>
            </div>
            <div class="face back">
              <span class="rear-screw screw-tl"></span><span class="rear-screw screw-tr"></span
              ><span class="rear-screw screw-bl"></span><span class="rear-screw screw-br"></span>
              <div class="rear-vent-bank"><span></span><span></span></div>
              <div class="rear-identity">Macintosh<span>MODEL 128K / 1984</span></div>
              <div class="rear-panel">
                <div class="rear-power">
                  <i class="power-rocker"></i><i class="power-socket"></i><small>POWER</small>
                </div>
                <div class="rear-connectors">
                  <span class="rear-port serial-port"><i></i><small>SERIAL</small></span
                  ><span class="rear-port disk-port"><i></i><small>DISK</small></span
                  ><span class="rear-port audio-port"><i></i><small>AUDIO</small></span>
                </div>
              </div>
            </div>
            <div class="face side left">
              <div class="side-vent"></div>
              <span class="side-seam"></span>
            </div>
            <div class="face side right">
              <div class="side-vent"></div>
              <span class="side-seam"></span>
            </div>
            <div class="face cap top">
              <span class="carry-handle"></span><span class="top-seam"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <section
    class="hologram"
    id="hologram"
    data-i18n-aria="archive.mac.collection"
    aria-label="悬浮软盘收藏"
    aria-hidden="true"
    inert
  >
    <div class="hologram-plane">
      <header class="hologram-header">
        <div class="date-tools">
          <label for="date-trigger" data-i18n="archive.mac.date">日期</label>
          <button
            id="day-prev"
            type="button"
            data-i18n-aria="archive.mac.previousDay"
            aria-label="上一天"
          >
            &lt;
          </button>
          <div class="date-picker">
            <button
              id="date-trigger"
              type="button"
              data-i18n-aria="archive.mac.chooseDate"
              aria-label="选择统计日期"
              aria-haspopup="dialog"
              aria-expanded="false"
            >
              <span data-i18n="archive.mac.today">今日</span>
              <svg viewBox="0 0 8 5" aria-hidden="true">
                <path d="M0 0H8L4 5Z" />
              </svg>
            </button>
            <!-- Month calendar popup -->
            <div
              class="mac-date-popup"
              id="mac-date-popup"
              role="dialog"
              data-i18n-aria="archive.mac.chooseDate"
              aria-label="选择统计日期"
              hidden
            >
              <div class="mac-calendar-nav">
                <div class="mac-calendar-year-picker">
                  <button
                    type="button"
                    id="mac-calendar-year-select"
                    data-i18n-aria="archive.mac.chooseYear"
                    aria-label="选择年份"
                    aria-haspopup="listbox"
                    aria-expanded="false"
                  ></button>
                  <div
                    id="mac-calendar-years"
                    class="mac-calendar-years"
                    role="listbox"
                    data-i18n-aria="archive.mac.years"
                    aria-label="历史年份"
                    hidden
                  ></div>
                </div>
                <div class="mac-calendar-month-nav">
                  <button
                    type="button"
                    id="mac-cal-prev-month"
                    data-i18n-aria="archive.mac.previousMonth"
                    aria-label="上一月"
                  >
                    &lt;
                  </button>
                  <span id="mac-cal-month-label">10月</span>
                  <button
                    type="button"
                    id="mac-cal-next-month"
                    data-i18n-aria="archive.mac.nextMonth"
                    aria-label="下一月"
                  >
                    &gt;
                  </button>
                </div>
                <button
                  type="button"
                  id="mac-cal-close"
                  data-i18n-aria="archive.mac.closeCalendar"
                  aria-label="关闭日历"
                >
                  ×
                </button>
              </div>
              <p class="mac-calendar-status" id="mac-calendar-status" role="status"></p>
              <div class="mac-calendar-grid" id="mac-calendar-grid">
                <span class="mac-calendar-weekday" data-weekday="0">日</span>
                <span class="mac-calendar-weekday" data-weekday="1">一</span>
                <span class="mac-calendar-weekday" data-weekday="2">二</span>
                <span class="mac-calendar-weekday" data-weekday="3">三</span>
                <span class="mac-calendar-weekday" data-weekday="4">四</span>
                <span class="mac-calendar-weekday" data-weekday="5">五</span>
                <span class="mac-calendar-weekday" data-weekday="6">六</span>
                <!-- 42 date cells generated dynamically -->
              </div>
            </div>
          </div>
          <button
            id="day-next"
            type="button"
            data-i18n-aria="archive.mac.nextDay"
            aria-label="下一天"
          >
            &gt;
          </button>
        </div>
      </header>
      <div class="projection-body">
        <div
          class="disk-deck"
          id="album-list"
          data-i18n-aria="archive.mac.disks"
          aria-label="专辑软盘"
        ></div>
        <div class="disk-actions" id="disk-controls">
          <button id="disk-eject" type="button" hidden data-i18n="archive.mac.eject">退盘</button>
        </div>
        <p class="screen-status" id="screen-status" role="status"></p>
        <p class="disk-status" id="disk-status" role="status"></p>
      </div>
    </div>
  </section>
</div>
