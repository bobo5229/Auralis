<!-- Stage Host -->
<section class="stage-host" id="stage" data-fidelity="device" aria-label="当日 Top 5 专辑舞台">
  <div class="stage-container">
    <canvas
      id="album-stage"
      class="stage-source"
      aria-label="专辑舞台，拖动旋转，方向键切换专辑"
    ></canvas>
    <canvas class="stage-output" width="320" height="192" aria-hidden="true"></canvas>
  </div>
  <div id="stage-caption" class="stage-caption">
    <span id="stage-title" class="sr"></span>
    <span id="stage-artist" class="sr"></span>
    <canvas id="stage-caption-face" aria-hidden="true"></canvas>
  </div>
  <div class="stage-controls">
    <button id="stage-prev" type="button" aria-label="上一张专辑">&lt;</button>
    <div id="stage-selectors" class="selectors"></div>
    <button id="stage-next" type="button" aria-label="下一张专辑">&gt;</button>
    <button id="stage-auto" type="button"></button>
    <span id="stage-position" class="position"></span>
    <button id="load-album" type="button" disabled style="display: none">装入</button>
  </div>
  <p class="stage-tip">当日播放排行 · 经典舞台展示</p>
</section>
