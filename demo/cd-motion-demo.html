<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auralis · CD 动效</title>
    <style>
      /* Standalone prototype: native CSS, reference-led light theme.
         DESIGN_VARIANCE 8 / MOTION_INTENSITY 6 / VISUAL_DENSITY 1. */
      body.cd-demo { margin: 0; background: #eeeeec; color: #292929; font: 13px "Segoe UI", "Microsoft YaHei", sans-serif; }
      .cd-demo * { box-sizing: border-box; }
      .cd-demo .page { height: 100dvh; min-height: 360px; display: grid; grid-template-rows: 1fr auto; overflow: hidden; }
      .cd-demo .stage { position: relative; min-height: 0; overflow: hidden; touch-action: pan-y; user-select: none; }
      .cd-demo .disc-position { position: absolute; left: 0; top: 0; width: 400px; height: 400px; pointer-events: none; }
      .cd-demo .hover-plane { width: 100%; height: 100%; transform: perspective(1100px) rotateX(0deg) rotateY(0deg); transition: transform 220ms cubic-bezier(0.2, 0.65, 0.3, 1); }
      .cd-demo .disc { position: relative; width: 100%; height: 100%; border-radius: 50%; background: #aaa; isolation: isolate; pointer-events: auto;
        /* A real transparent spindle hole, including when discs overlap. */
        mask-image: radial-gradient(circle, transparent 0 6.8%, #000 7.1%);
        box-shadow: inset 0 0 0 2px #858586; }
      .cd-demo .art { position: absolute; inset: 4px; border-radius: 50%; overflow: hidden; background: var(--fallback); }
      .cd-demo .art img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .cd-demo .disc > * { pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { .cd-demo .hover-plane { transition: none; } }
      .cd-demo .disc::before { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: 50%; pointer-events: none;
        background: linear-gradient(120deg, #fff3, transparent 30%, #0001 65%, #fff2);
        box-shadow: inset 1px 1px 0 2px #ffffff80, inset -2px -2px 0 3px #42424280, inset 0 0 0 5px #dadbd550; }
      .cd-demo .hub { position: absolute; z-index: 2; width: 25%; height: 25%; left: 37.5%; top: 37.5%; border-radius: 50%;
        background: conic-gradient(from 30deg, #bdc1c6, #e2e4e4, #a0a6b1, #ccd5d8, #eeece8, #989da6, #bdc1c6);
        box-shadow: 0 0 0 2px #eeeeee70, 0 0 0 7px #b7b7b744, inset 0 0 0 3px #888b9290; }
      .cd-demo .hub::after { content: ""; position: absolute; inset: 14%; border-radius: 50%; border: 5px solid #f8f8f890; box-shadow: 0 0 0 2px #6c747b60; }
      .cd-demo .controls { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 20px 32px 26px; position: relative; }
      .cd-demo .actions { display: flex; align-items: center; gap: 8px; }
      .cd-demo button, .cd-demo .import { font: inherit; color: inherit; border: 1px solid #bdbdb9; background: transparent; border-radius: 3px; padding: 11px 16px; cursor: pointer; white-space: nowrap; }
      .cd-demo button:hover, .cd-demo .import:hover { background: #e1e1de; }
      .cd-demo button:active { transform: translateY(1px); }
      .cd-demo button:focus-visible, .cd-demo .import:focus-within { outline: 2px solid #292929; outline-offset: 4px; }
      .cd-demo .hint { color: #62625f; margin: 0; font-size: 12px; }
      .cd-demo .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      @media (max-width: 640px) { .cd-demo .controls { padding: 16px; flex-wrap: wrap; gap: 12px; } .cd-demo .hint { width: 100%; order: 3; } .cd-demo button, .cd-demo .import { padding: 10px 12px; } }
    </style>
  </head>
  <body class="cd-demo">
    <main class="page" aria-label="专辑光盘动效演示">

      <footer class="controls">
        <label class="import">替换封面<input class="sr-only" id="covers" type="file" accept="image/*" multiple /></label>
        <p class="hint">方向键或左右滑动切换 · 当前为示例盘面</p>
        <div class="actions"><button id="previous" aria-label="上一张专辑">← 上一张</button><button id="next" aria-label="下一张专辑">下一张 ↗</button></div>
      </footer>
      <p class="sr-only" id="status" role="status" aria-live="polite"></p>
    </main>

          const node = discNodes.get(event.target);
          if (node !== hovered) resetHover();
          if (!node) return;
          hovered = node;
          // Use the un-tilted outer slot for stable coordinates. The hover layer
          // rotates in screen axes, independently of the disc's base pose and inertial sway.
          const rect = node.slot.getBoundingClientRect();
          const clamp = (value) => Math.max(-1, Math.min(1, value));
          const x = clamp((event.clientX - rect.left) / rect.width * 2 - 1);
          const y = clamp((event.clientY - rect.top) / rect.height * 2 - 1);
          node.hoverPlane.style.transform = `perspective(1100px) rotateX(${-y * 4}deg) rotateY(${x * 4}deg)`;
        }, eventOptions);
        stage.addEventListener('pointerleave', resetHover, eventOptions);
        window.addEventListener('blur', resetHover, eventOptions);
        window.addEventListener('keydown', (event) => {
          if (event.target instanceof HTMLInputElement || event.ctrlKey || event.metaKey || event.altKey) return;
          if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
            event.preventDefault();
            if (!event.repeat) navigate(event.key === 'ArrowRight' ? 1 : -1);
          }
        }, eventOptions);
        stage.addEventListener('pointerdown', (event) => {
          if (!event.isPrimary || event.button !== 0) return;
          resetHover();
          pointer = { id: event.pointerId, x: event.clientX, y: event.clientY };
          stage.setPointerCapture(event.pointerId);
        }, eventOptions);
        stage.addEventListener('pointerup', (event) => {
          if (!pointer || pointer.id !== event.pointerId) return;
          const dx = event.clientX - pointer.x;
          const dy = event.clientY - pointer.y;
          pointer = null;
          if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) navigate(dx < 0 ? 1 : -1);
        }, eventOptions);
        stage.addEventListener('pointercancel', () => { pointer = null; }, eventOptions);
        reduceMotion.addEventListener('change', () => {
          resetHover();
          if (!reduceMotion.matches || !active) return;
          cancelAnimationFrame(frame);
          selected = active.target;
          active = null; frame = 0;
          swayAngle = 0; swayVelocity = 0;
          render(selected); announce();
        }, eventOptions);
        document.querySelector('#covers').addEventListener('change', (event) => {
          const files = Array.from(event.target.files).filter((file) => file.type.startsWith('image/'));
          if (!files.length) return;
          resetHover();
          cancelAnimationFrame(frame); active = null; frame = 0;
          swayAngle = 0; swayVelocity = 0;
          for (const node of nodes.values()) node.slot.remove();
          nodes.clear();
          objectUrls.forEach((url) => URL.revokeObjectURL(url));
          objectUrls = files.map((file) => URL.createObjectURL(file));
          covers = objectUrls; selected = 0;
          hint.textContent = '方向键或左右滑动切换 · 封面仅在本地使用';
          render(selected); announce();
          event.target.value = '';
        }, eventOptions);
        const observer = new ResizeObserver(() => {
          resetHover();
          width = stage.clientWidth; height = stage.clientHeight;
          if (!active) render(selected);
        });
        observer.observe(stage);
        width = stage.clientWidth; height = stage.clientHeight;
        render(selected); announce();
        window.addEventListener('pagehide', (event) => {
          if (event.persisted) return;
          cancelAnimationFrame(frame); observer.disconnect(); listeners.abort();
          objectUrls.forEach((url) => URL.revokeObjectURL(url));
        }, { once: true });
      })();
    </script>
  </body>
</html>
