<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auralis 竖向音量方案对比</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        --bg: #0b0a09;
        --panel: #11100e;
        --surface: #211e1a;
        --line: rgb(232 220 198 / 0.12);
        --line-strong: rgb(232 220 198 / 0.22);
        --text: #f3eee6;
        --muted: #aaa197;
        --faint: #736c64;
        --accent: #c9b184;
        --accent-soft: rgb(201 177 132 / 0.16);
        --track: rgb(232 220 198 / 0.1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-width: 1180px;
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(circle at 50% 105%, rgb(201 177 132 / 0.08), transparent 34%), var(--bg);
      }
      button,
      input {
        font: inherit;
      }
      button {
        color: inherit;
      }
      .page {
        width: min(1400px, calc(100% - 72px));
        margin: 0 auto;
        padding: 46px 0 54px;
      }
      .page-header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 30px;
      }
      .heading-copy {
        max-width: 720px;
      }
      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: 32px;
        line-height: 1.12;
        letter-spacing: -0.035em;
      }
      .lead {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }
      .page-actions {
        display: flex;
        gap: 8px;
      }
      .page-action {
        height: 34px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgb(33 30 26 / 0.72);
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
      }
      .page-action:hover {
        border-color: var(--line-strong);
        color: var(--text);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        margin-top: 34px;
      }
      .card {
        min-width: 0;
        overflow: hidden;
        border: 1px solid rgb(232 220 198 / 0.09);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 26px 64px rgb(0 0 0 / 0.24);
      }
      .card-header {
        min-height: 116px;
        padding: 23px 23px 18px;
        border-bottom: 1px solid rgb(232 220 198 / 0.07);
      }
      .card-name {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .index {
        display: grid;
        width: 24px;
        height: 24px;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        color: var(--accent);
        font-size: 10px;
        font-weight: 800;
      }
      h2 {
        margin: 0;
        font-size: 17px;
        letter-spacing: -0.02em;
      }
      .desc {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }
      .preview {
        position: relative;
        height: 420px;
        overflow: hidden;
        background: linear-gradient(180deg, rgb(255 255 255 / 0.012), transparent 26%), #0f0e0c;
      }
      .ghost {
        padding: 25px 21px;
        opacity: 0.27;
      }
      .ghost-head {
        display: flex;
        justify-content: space-between;
        margin-bottom: 14px;
        color: var(--muted);
        font-size: 11px;
      }
      .ghost-row {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr) 40px;
        align-items: center;
        height: 42px;
        border-top: 1px solid rgb(232 220 198 / 0.08);
        color: var(--muted);
        font-size: 10px;
      }
      .ghost-row:last-child {
        border-bottom: 1px solid rgb(232 220 198 / 0.08);
      }
      .ghost-row span:last-child {
        text-align: right;
      }
      .bar {
        position: absolute;
        right: 18px;
        bottom: 28px;
        left: 18px;
        height: 66px;
        border: 1px solid var(--line-strong);
        border-radius: 25px;
        background:
          linear-gradient(180deg, rgb(255 255 255 / 0.08), transparent 36%),
          linear-gradient(90deg, rgb(201 177 132 / 0.13), transparent 42%), rgb(31 28 24 / 0.96);
        box-shadow:
          0 20px 42px rgb(0 0 0 / 0.3),
          inset 0 1px 0 rgb(255 255 255 / 0.1);
      }
      .bar-row {
        position: relative;
        z-index: 5;
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr) max-content;
        align-items: center;
        gap: 7px;
        height: 100%;
        padding: 0 9px;
      }
      .transport,
      .tools {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .control {
        display: inline-grid;
        width: 29px;
        height: 29px;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition:
          color 160ms ease,
          background 160ms ease,
          transform 160ms ease;
      }
      .control:hover,
      .control[aria-expanded='true'] {
        color: var(--accent);
        background: var(--accent-soft);
      }
      .control:active {
        transform: scale(0.94);
      }
      .control:focus-visible,
      .page-action:focus-visible,
      .slider:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .primary {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--accent);
        color: #17130e;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.3);
      }
      .identity {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .cover {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 0.1);
        border-radius: 9px;
        color: rgb(255 255 255 / 0.7);
        background:
          radial-gradient(circle at 30% 24%, rgb(232 215 176 / 0.42), transparent 24%),
          linear-gradient(135deg, #8a623d, #1d1813 72%);
        font-size: 11px;
      }
      .copy {
        min-width: 0;
      }
      .title,
      .subtitle {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .title {
        font-size: 11px;
        font-weight: 700;
      }
      .subtitle {
        margin-top: 3px;
        color: var(--muted);
        font-size: 9px;
      }
      .anchor {
        position: relative;
        display: grid;
        width: 32px;
        height: 38px;
        place-items: center;
      }
      .volume-button {
        position: relative;
        z-index: 12;
      }
      .speaker-mark {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .speaker {
        width: 7px;
        height: 9px;
        background: currentColor;
        clip-path: polygon(0 28%, 38% 28%, 100% 0, 100% 100%, 38% 72%, 0 72%);
      }
      .wave {
        width: 6px;
        height: 10px;
        border-right: 1.5px solid currentColor;
        border-radius: 0 999px 999px 0;
      }
      .surface {
        position: absolute;
        z-index: 8;
        display: flex;
        transform-origin: 50% 100%;
        flex-direction: column;
        align-items: center;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 170ms ease,
          transform 220ms cubic-bezier(0.16, 1, 0.3, 1),
          visibility 170ms ease;
      }
      .anchor:not(.open) .surface {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .value {
        position: relative;
        z-index: 2;
        color: var(--accent);
        font-size: 9px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .slider {
        position: relative;
        z-index: 2;
        width: 4px;
        height: 86px;
        margin: 7px 0 0;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        direction: rtl;
        writing-mode: vertical-lr;
        appearance: none;
      }
      .slider::-webkit-slider-runnable-track {
        width: 4px;
        height: 86px;
        border-radius: 999px;
        background: linear-gradient(
          to top,
          var(--accent) 0%,
          var(--accent) var(--volume),
          var(--track) var(--volume),
          var(--track) 100%
        );
      }
      .slider::-webkit-slider-thumb {
        width: 11px;
        height: 11px;
        margin-left: -3.5px;
        border: 2px solid var(--accent);
        border-radius: 50%;
        background: var(--text);
        box-shadow: 0 2px 7px rgb(0 0 0 / 0.32);
        appearance: none;
      }

      .a .surface {
        left: 50%;
        bottom: calc(100% + 5px);
        width: 46px;
        height: 136px;
        padding: 13px 0 15px;
        transform: translateX(-50%);
        border: 1px solid var(--line-strong);
        border-bottom-color: transparent;
        border-radius: 23px 23px 14px 14px;
        background:
          linear-gradient(180deg, rgb(255 255 255 / 0.1), transparent 30%),
          linear-gradient(0deg, rgb(201 177 132 / 0.09), transparent 50%), var(--surface);
        box-shadow:
          0 16px 32px rgb(0 0 0 / 0.28),
          inset 0 1px 0 rgb(255 255 255 / 0.1);
      }
      .a .surface::after {
        position: absolute;
        left: 50%;
        bottom: -15px;
        width: 34px;
        height: 16px;
        transform: translateX(-50%);
        clip-path: polygon(16% 0, 84% 0, 100% 100%, 0 100%);
        background: var(--surface);
        content: '';
      }
      .a .anchor:not(.open) .surface {
        transform: translateX(-50%) translateY(7px) scaleY(0.9);
      }
      .a .volume-button[aria-expanded='true'] {
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px rgb(201 177 132 / 0.24);
      }

      .b .bar {
        border-top-right-radius: 20px;
      }
      .b .surface {
        right: -11px;
        bottom: 25px;
        width: 66px;
        height: 164px;
        padding: 14px 0 19px;
        border: 1px solid var(--line-strong);
        border-radius: 25px 25px 17px 22px;
        background:
          linear-gradient(180deg, rgb(255 255 255 / 0.09), transparent 26%),
          linear-gradient(0deg, rgb(201 177 132 / 0.12), transparent 44%), #24201b;
        box-shadow:
          -10px 18px 38px rgb(0 0 0 / 0.25),
          inset 0 1px 0 rgb(255 255 255 / 0.1);
      }
      .b .surface::after {
        position: absolute;
        right: -1px;
        bottom: -21px;
        width: 66px;
        height: 24px;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 52% 100%);
        background: #24201b;
        content: '';
      }
      .b .caption {
        margin-bottom: 5px;
        color: var(--faint);
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.13em;
      }
      .b .value {
        padding: 3px 7px;
        border-radius: 7px;
        background: rgb(201 177 132 / 0.12);
      }
      .b .slider,
      .b .slider::-webkit-slider-runnable-track {
        height: 91px;
      }
      .b .anchor:not(.open) .surface {
        transform: translateY(7px) scaleY(0.9);
      }

      .c .anchor::before {
        position: absolute;
        top: -22px;
        left: 50%;
        z-index: 10;
        width: 2px;
        height: 28px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: linear-gradient(180deg, var(--accent), rgb(201 177 132 / 0.16));
        content: '';
        opacity: 0;
        transition: opacity 160ms ease;
      }
      .c .anchor.open::before {
        opacity: 1;
      }
      .c .surface {
        left: 50%;
        bottom: calc(100% + 17px);
        width: 38px;
        height: 137px;
        padding: 9px 0 11px;
        transform: translateX(-50%);
        border: 1px solid rgb(232 220 198 / 0.16);
        border-radius: 19px;
        background: rgb(31 28 24 / 0.68);
        box-shadow:
          0 14px 28px rgb(0 0 0 / 0.2),
          inset 0 1px 0 rgb(255 255 255 / 0.08);
        backdrop-filter: blur(18px) saturate(1.2);
      }
      .c .surface::after {
        position: absolute;
        bottom: -19px;
        left: 50%;
        width: 2px;
        height: 20px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: var(--accent);
        content: '';
      }
      .c .anchor:not(.open) .surface {
        transform: translateX(-50%) translateY(7px) scaleY(0.9);
      }
      .c .value {
        display: grid;
        width: 24px;
        height: 24px;
        place-items: center;
        border: 1px solid rgb(201 177 132 / 0.26);
        border-radius: 50%;
        background: rgb(201 177 132 / 0.09);
      }
      .c .slider {
        height: 88px;
        margin-top: 5px;
      }
      .c .slider::-webkit-slider-runnable-track {
        width: 2px;
        height: 88px;
      }
      .c .slider::-webkit-slider-thumb {
        width: 10px;
        height: 10px;
        margin-left: -4px;
      }
      .c .volume-button[aria-expanded='true'] {
        border-radius: 50%;
        background: var(--accent);
        color: #17130e;
      }
      .card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 49px;
        padding: 0 19px;
        border-top: 1px solid rgb(232 220 198 / 0.07);
        color: var(--faint);
        font-size: 10px;
      }
      .card-footer strong {
        color: var(--muted);
        font-weight: 650;
      }
      @media (prefers-reduced-motion: reduce) {
        .control,
        .surface,
        .anchor::before {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div class="heading-copy">
          <p class="eyebrow">Auralis interaction study</p>
          <h1>竖向音量弹窗，三种连接方式</h1>
          <p class="lead">
            三种方案都从音量按钮向上展开，分别采用连续肩部、侧边共面和轻量轴线建立与 Playbar
            的关系。
          </p>
        </div>
        <div class="page-actions">
          <button id="openAll" class="page-action">全部展开</button
          ><button id="closeAll" class="page-action">全部收起</button>
        </div>
      </header>
      <section id="grid" class="grid" aria-label="音量弹窗方案对比"></section>
    </main>
    <script>
      const options = [
        {
          key: 'a',
          index: 'A',
          name: '连续柱',
          desc: '梯形肩部收进按钮中心，形成完整、连续的控制体。',
          verdict: '均衡、完整',
          note: '建议作为默认方向',
          caption: '',
        },
        {
          key: 'b',
          index: 'B',
          name: '侧挂翼板',
          desc: '与 Playbar 右端共用外轮廓，像播放器的一体化侧模块。',
          verdict: '结构感最强',
          note: '适合强化设备感',
          caption: 'VOLUME',
        },
        {
          key: 'c',
          index: 'C',
          name: '轻量轨道',
          desc: '用细轴线贯穿弹窗与按钮，弱化容器重量。',
          verdict: '最轻、最克制',
          note: '适合降低视觉占用',
          caption: '',
        },
      ]
      const grid = document.querySelector('#grid')
      grid.innerHTML = options
        .map(
          (o) => `
        <article class="card ${o.key}">
          <header class="card-header"><div class="card-name"><span class="index">${o.index}</span><h2>${o.name}</h2></div><p class="desc">${o.desc}</p></header>
          <div class="preview">
            <div class="ghost" aria-hidden="true"><div class="ghost-head"><span>最近播放</span><span>12 首曲目</span></div><div class="ghost-row"><span>01</span><span>Weightless</span><span>08:08</span></div><div class="ghost-row"><span>02</span><span>Near Light</span><span>03:28</span></div><div class="ghost-row"><span>03</span><span>Andata</span><span>04:41</span></div></div>
            <div class="bar"><div class="bar-row">
              <div class="transport"><button class="control" aria-label="上一首">‹</button><button class="control primary" aria-label="播放">▶</button><button class="control" aria-label="下一首">›</button></div>
              <div class="identity"><div class="cover">◉</div><div class="copy"><div class="title">Piano Concerto No. 2</div><div class="subtitle">Sergei Rachmaninoff</div></div></div>
              <div class="tools"><button class="control" aria-label="播放队列">≡</button><button class="control" aria-label="播放模式">↻</button>
                <div class="anchor open" data-anchor><div class="surface" role="group" aria-label="音量">${o.caption ? `<span class="caption">${o.caption}</span>` : ''}<span class="value" data-value>68${o.key === 'b' ? '%' : ''}</span><input class="slider" data-slider type="range" min="0" max="100" value="68" aria-label="音量" style="--volume:68%"></div><button class="control volume-button" data-button aria-label="音量" aria-haspopup="true" aria-expanded="true"><span class="speaker-mark"><span class="speaker"></span><span class="wave"></span></span></button></div>
              </div>
            </div></div>
          </div>
          <footer class="card-footer"><strong>${o.verdict}</strong><span>${o.note}</span></footer>
        </article>`,
        )
        .join('')

      const anchors = [...document.querySelectorAll('[data-anchor]')]
      const setOpen = (anchor, open) => {
        anchor.classList.toggle('open', open)
        anchor.querySelector('[data-button]').setAttribute('aria-expanded', String(open))
      }
      anchors.forEach((anchor) => {
        const button = anchor.querySelector('[data-button]'),
          slider = anchor.querySelector('[data-slider]'),
          value = anchor.querySelector('[data-value]'),
          percent = value.textContent.includes('%')
        button.addEventListener('click', (event) => {
          event.stopPropagation()
          setOpen(anchor, !anchor.classList.contains('open'))
        })
        anchor.addEventListener('click', (event) => event.stopPropagation())
        slider.addEventListener('input', () => {
          value.textContent = `${slider.value}${percent ? '%' : ''}`
          slider.style.setProperty('--volume', `${slider.value}%`)
        })
      })
      document.querySelector('#openAll').addEventListener('click', (event) => {
        event.stopPropagation()
        anchors.forEach((a) => setOpen(a, true))
      })
      document.querySelector('#closeAll').addEventListener('click', (event) => {
        event.stopPropagation()
        anchors.forEach((a) => setOpen(a, false))
      })
      document.addEventListener('click', () => anchors.forEach((a) => setOpen(a, false)))
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') anchors.forEach((a) => setOpen(a, false))
      })
    </script>
  </body>
</html>
