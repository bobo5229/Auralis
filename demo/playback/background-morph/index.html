<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auralis · 背景材质演化</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="flow-source" aria-hidden="true"></div>
    <canvas id="background" aria-hidden="true"></canvas>
    <header class="topbar">
      <span class="brand">Auralis <span>材质演化 · Prototype</span></span>
      <span id="status" role="status">正在准备背景…</span>
    </header>
    <main class="listening-scene">
      <section class="artwork-column" aria-label="演示封面">
        <img id="artwork" alt="暮色配色的抽象演示封面" />
        <div class="metadata">
          <h1 id="artwork-title">暮色</h1>
          <p>流光，凝成金属。</p>
        </div>
      </section>
      <section class="lyrics-column" aria-label="固定位置的演示文字">
        <p class="lyric-muted">让色彩慢慢流动</p>
        <p class="lyric-active">在光里，凝成另一种形状</p>
        <p class="lyric-muted">又在下一刻，柔软下来</p>
        <span class="scene-caption">封面与文字在切换中保持原位</span>
      </section>
    </main>
    <section class="controls" aria-label="背景演化控制">
      <div class="control-topline">
        <div class="mode-control" role="group" aria-label="背景模式">
          <button type="button" data-mode="0" aria-pressed="true" disabled>流光</button>
          <button type="button" data-mode="1" aria-pressed="false" disabled>液态金属</button>
        </div>
        <div class="sample-control" role="group" aria-label="演示配色">
          <button type="button" data-sample="dusk" aria-pressed="true" disabled>暮色</button>
          <button type="button" data-sample="tide" aria-pressed="false" disabled>海潮</button>
          <button type="button" data-sample="ember" aria-pressed="false" disabled>余烬</button>
          <button type="button" id="choose-artwork" disabled>本地封面</button>
          <input id="artwork-file" type="file" accept="image/*" hidden />
        </div>
      </div>
      <div class="morph-control">
        <span>柔软</span>
        <input
          id="phase"
          type="range"
          min="0"
          max="1"
          step="0.001"
          value="0"
          aria-label="材质演化进度"
          disabled
        />
        <span>凝结</span>
        <output id="phase-value" for="phase">0%</output>
      </div>
      <div class="control-bottomline">
        <label class="duration-control" for="duration"
          >切换时长
          <input id="duration" type="range" min="0.4" max="3" step="0.05" value="0.95" disabled />
          <output id="duration-value" for="duration">0.95s</output>
        </label>
        <div class="actions">
          <button type="button" id="freeze" aria-pressed="false" disabled>停住背景</button>
          <button type="button" id="slow" aria-pressed="false" disabled>慢放 ×3</button>
          <button type="button" id="cycle" aria-pressed="false" disabled>往返演示</button>
        </div>
      </div>
    </section>
    <p id="error" role="alert" hidden></p>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
