<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专辑代表色对比</title>
<style>body{margin:0;background:#181a1b;color:#f1f1ef;font:15px system-ui}main{max-width:1200px;margin:auto;padding:32px}header{display:flex;gap:24px;align-items:center;flex-wrap:wrap}#cover{width:150px;aspect-ratio:1;object-fit:cover}button,label{background:#3a3c3e;border:0;border-radius:8px;padding:10px;color:white;cursor:pointer}input{max-width:210px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}#previews{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}.panel{background:#262829;padding:14px;border-radius:12px}.panel h2{font-size:16px}.panel small{float:right}.surface{display:grid;grid-template-columns:20% 60% 20%;height:300px;overflow:hidden;border-radius:8px}.surface aside{background:var(--side);color:var(--side-text);padding:14px;line-height:2}.surface>div{background:var(--main);color:var(--text);padding:16px}.surface img{width:120px;aspect-ratio:1;object-fit:cover}</style></head><body><main><h1>专辑代表色对比</h1><header><img id="cover" alt="封面"><div><label>选择本地封面 <input id="upload" type="file" accept="image/*"></label><p id="status" role="status"></p><p>图片仅在本机处理。可上传 Supernatural 和你的婚礼封面。</p></div></header><div class="buttons"><button data-sample="doja">Doja</button><button data-sample="pink">Pink Pony Club</button><button data-sample="lover">Lover</button><button data-sample="white">白色封面</button><button data-sample="dark">黑色封面</button></div><div id="previews"></div></main><script>/* SCRIPT */</script></body></html>
