<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auralis · Quiet information</title>
<style>
@font-face{font-family:CD;src:url('../../../src/renderer/assets/fonts/cd-room/EBGaramond-normal-latin.woff2')}@font-face{font-family:CD;src:url('../../../src/renderer/assets/fonts/cd-room/EBGaramond-italic-latin.woff2');font-style:italic}@font-face{font-family:GenRyu;src:url('../../../src/renderer/assets/fonts/GenRyuMin2TC-otf/GenRyuMin2TC-R.woff2')}@font-face{font-family:MiSans;src:url('../../../src/renderer/assets/fonts/MiSans/MiSans-Regular.woff2')}@font-face{font-family:MiSans;src:url('../../../src/renderer/assets/fonts/MiSans/MiSans-Medium.woff2');font-weight:500}
*{box-sizing:border-box}body{margin:0;font-family:MiSans,system-ui,sans-serif}.room{--bg:#eeeeec;--text:#292929;--muted:#62625b;--faint:#85857d;--line:#aaa9a3;position:relative;height:100dvh;min-height:500px;overflow:hidden;background:var(--bg);color:var(--text)}.room.dark{--bg:#2b2d30;--text:#e6e4de;--muted:#a8a69f;--faint:#7d7b75;--line:#4a4f56;background:repeating-linear-gradient(135deg,rgba(224,226,230,.045) 0 1px,transparent 1px 7px),var(--bg)}
.header{position:absolute;top:24px;left:32px;color:var(--muted);font-size:17px}.surface{display:none;position:absolute;top:29px;left:50%;transform:translateX(-50%);font:16px CD,serif;word-spacing:25px;color:var(--muted)}.focus .surface{display:block}.surface span{color:var(--text);border-bottom:1px solid;padding-bottom:5px}.album-info{position:absolute;left:32px;top:80px;width:min(380px,27vw);font-family:CD,serif}.album-heading{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid var(--text);padding-bottom:12px;gap:12px}.album-heading h1{font-size:34px;font-style:italic;font-weight:400;margin:0}.album-heading small{font-size:14px}.field{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}.field span:first-child{color:var(--muted)}
.stage{position:absolute;inset:70px 0 80px;display:flex;align-items:center;justify-content:center;perspective:1100px}.disc{width:min(420px,36vw,48vh);aspect-ratio:1;border-radius:50%;position:relative;background:#aaa;box-shadow:0 22px 35px #0004,inset 0 0 0 2px #858586;transform:rotateY(-14deg) rotateX(5deg);transition:transform .55s,width .55s}.focus .disc{width:min(490px,39vw,55vh);transform:rotateY(0)}.disc:before{content:'';position:absolute;inset:4px;border-radius:50%;background:linear-gradient(120deg,#ffffff70,transparent 32%,#0003 65%,#fff4),url('../selection-patch/lover.jpg') center/cover;box-shadow:inset 0 0 0 5px #dadbd550}.disc:after{content:'';position:absolute;inset:37.5%;border-radius:50%;background:radial-gradient(circle,transparent 0 18%,#eaeaea 19% 25%,#92999d 27%,#dadfe0 43%,#8b9196 62%,#d4d8d8 80%);box-shadow:0 0 0 5px #ddd8,inset 0 0 0 3px #8889}.ring{display:none;position:absolute;inset:-26px;border:1.5px solid var(--faint);border-radius:50%;opacity:.65}.focus .ring{display:block}
.tracks{display:none;position:absolute;right:32px;top:50%;transform:translateY(-50%);width:min(320px,23vw);font-family:CD,serif}.focus .tracks{display:block}.tracks header{display:flex;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--text);font-size:20px}.track{display:grid;grid-template-columns:26px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}.track span:first-child,.track span:last-child{color:var(--faint)}.track.active{color:var(--text);font-weight:bold}
.now{font-family:CD,GenRyu,serif;position:absolute;left:32px;bottom:88px;width:min(380px,30vw);height:106px}.title{font-size:20px;line-height:27px;font-weight:500;height:54px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.artist{font-size:15px;line-height:22px;color:var(--muted)}.playing-album{font-size:13px;line-height:19px;color:var(--faint)}.footer{position:absolute;left:32px;bottom:27px;color:var(--muted);font-size:18px}.controls{position:absolute;right:20px;bottom:18px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:65%;z-index:3}.controls button,.reveal{font:12px MiSans,sans-serif;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;cursor:pointer}.controls button[aria-pressed=true]{color:var(--text);border-color:var(--text)}.reveal{display:none;position:absolute;right:20px;bottom:18px;opacity:.15}.reveal:focus,.reveal:hover{opacity:1}.room.presentation .controls{display:none}.room.presentation .reveal{display:block}
</style>
</head>
<body><main class="room" id="room">
<div class="header" aria-hidden="true">×</div><div class="surface"><span>CD</span> Vinyl</div>
<section class="album-info" aria-label="专辑信息"><div class="album-heading"><h1>Lover</h1><small>18 TRACKS</small></div><div class="field"><span>Artist</span><span>Taylor Swift</span></div><div class="field"><span>Release Date</span><span>2019.08.23</span></div><div class="field"><span>Copyright</span><span>℗ 2019 Taylor Swift</span></div></section>
<div class="stage" aria-hidden="true"><div class="disc"><div class="ring"></div></div></div>
<section class="tracks" aria-label="曲目列表"><header><span>Tracks</span><span>↻</span></header><div class="track"><span>01</span><span>I Forgot That You Existed</span><span>2:50</span></div><div class="track"><span>02</span><span>Cruel Summer</span><span>2:58</span></div><div class="track active"><span>03</span><span>Lover</span><span>3:41</span></div><div class="track"><span>04</span><span>The Man</span><span>3:10</span></div><div class="track"><span>05</span><span>The Archer</span><span>3:31</span></div><div class="track"><span>06</span><span>I Think He Knows</span><span>2:53</span></div></section>
<section class="now" aria-label="正在播放"><div class="title" id="title">Lover</div><div class="artist" id="artist">Taylor Swift</div><div class="playing-album" id="playingAlbum">Lover</div></section><div class="footer" aria-hidden="true">☼</div>
<nav class="controls" aria-label="演示控制"><button id="mode" aria-pressed="false">聚焦</button><button id="theme" aria-pressed="false">深色</button><button id="long" aria-pressed="false">长标题</button><button id="same" aria-pressed="true">同专辑</button><button id="hide">隐藏控制</button></nav><button class="reveal" id="show">显示控制</button>
</main><script>
const room=document.querySelector('#room'), title=document.querySelector('#title'), album=document.querySelector('#playingAlbum');let focused=false,dark=false,long=false,same=true;
function render(){room.classList.toggle('focus',focused);room.classList.toggle('dark',dark);title.textContent=long?'cardigan (a very long title that continues through the night and beyond the morning light)':same?'Lover':'cardigan';document.querySelector('.track.active')?.classList.remove('active');if(same)document.querySelectorAll('.track')[2].classList.add('active');album.textContent=same?'Lover':'folklore';album.style.visibility=focused&&same?'hidden':'visible';for(const [id,value] of Object.entries({mode:focused,theme:dark,long,same}))document.getElementById(id).setAttribute('aria-pressed',String(value));document.querySelector('#mode').textContent=focused?'浏览':'聚焦';document.querySelector('#theme').textContent=dark?'浅色':'深色';document.querySelector('#same').textContent=same?'同专辑':'其他专辑'}
document.querySelector('#mode').onclick=()=>{focused=!focused;render()};document.querySelector('#theme').onclick=()=>{dark=!dark;render()};document.querySelector('#long').onclick=()=>{long=!long;render()};document.querySelector('#same').onclick=()=>{same=!same;render()};document.querySelector('#hide').onclick=()=>room.classList.add('presentation');document.querySelector('#show').onclick=()=>room.classList.remove('presentation');render();
</script></body></html>
