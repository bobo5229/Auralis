<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auralis · 专辑播放按钮方案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101211;color:#edf0ed;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1100px;margin:auto;padding:42px 28px 64px}h1{font-size:26px;margin:0 0 8px}header p{color:#9fa7a0;margin:0;max-width:750px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0} .toolbar button,.toolbar label{border:1px solid #434a44;border-radius:8px;background:#202520;color:#edf0ed;padding:8px 12px;font:inherit}.toolbar button{cursor:pointer}.toolbar label{display:flex;gap:9px;align-items:center}input[type=color]{border:0;background:none;width:28px;height:22px;padding:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{border:1px solid #343a35;border-radius:14px;overflow:hidden;background:#191d1a}.info{padding:16px 20px 14px;min-height:116px}.title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}.rank{color:#a6b1a7;font-size:12px;letter-spacing:.05em}.badge{font-size:11px;color:#b7eac4;border:1px solid #52775b;border-radius:99px;padding:2px 8px}.info p{color:#a7b0a8;margin:7px 0 0;font-size:13px}.preview{--accent:#1dd55f;--surface:#262c28;--text:#f4f6f4;--muted:#abb4ac;--on-accent:#121212; background:var(--surface);color:var(--text);padding:24px;min-height:205px;display:flex;align-items:center;gap:22px}.preview.light{--surface:#edf0ed;--text:#202521;--muted:#646e66;--on-accent:#121212}.cover{width:112px;height:112px;flex:none;border-radius:16px;background:linear-gradient(145deg,#5a6d60,#252e2c 55%,#a5a88d);display:grid;place-items:center;color:#e4e9dd;font:italic 19px Georgia,serif;letter-spacing:.08em}.album{min-width:0}.album h2{font-size:20px;line-height:1.2;margin:0 0 6px}.album p{color:var(--muted);margin:0 0 18px;font-size:13px}.actions{display:flex;align-items:center;gap:8px}.actions button{height:40px;border-radius:999px;font:650 14px "Segoe UI","Microsoft YaHei",sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;white-space:nowrap}.actions button:focus-visible{outline:2px solid var(--text);outline-offset:3px}.play{min-width:96px;padding:0 16px}.shuffle{width:40px;padding:0}.actions svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.play svg{fill:currentColor;stroke:none}.feedback{height:20px;margin-top:8px;color:var(--muted);font-size:12px}.s1 .play{background:var(--accent);border:1px solid var(--accent);color:var(--on-accent)}.s1 .shuffle{background:color-mix(in srgb,var(--text) 10%,transparent);border:1px solid transparent;color:var(--text)}.s1 button:hover{filter:brightness(1.12)}
.s2 .play{background:var(--accent);border:1px solid var(--accent);color:var(--on-accent)}.s2 .shuffle{background:transparent;border:1px solid color-mix(in srgb,var(--text) 36%,transparent);color:var(--text)}.s2 button:hover{background:color-mix(in srgb,var(--accent) 30%,var(--surface));color:var(--text)}
.s3 .play{background:color-mix(in srgb,var(--accent) 22%,var(--surface));border:1px solid transparent;color:var(--text)}.s3 .shuffle{background:color-mix(in srgb,var(--text) 10%,transparent);border:1px solid transparent;color:var(--text)}.s3 button:hover{background:color-mix(in srgb,var(--accent) 35%,var(--surface))}
.s4 .play{background:var(--text);border:1px solid var(--text);color:var(--surface)}.s4 .shuffle{background:transparent;border:1px solid color-mix(in srgb,var(--text) 30%,transparent);color:var(--text)}.s4 button:hover{opacity:.75}
.s5 .play{background:transparent;border:1px solid var(--accent);color:var(--text)}.s5 .shuffle{background:transparent;border:1px solid color-mix(in srgb,var(--text) 30%,transparent);color:var(--text)}.s5 button:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.s6 .play{background:color-mix(in srgb,var(--text) 12%,transparent);border:1px solid transparent;color:var(--text)}.s6 .play svg{fill:var(--accent)}.s6 .shuffle{background:transparent;border:1px solid transparent;color:var(--text)}.s6 button:hover{background:color-mix(in srgb,var(--text) 20%,transparent)}
.actions button:active{opacity:.72}footer{color:#929c93;margin-top:24px;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}}@media(max-width:430px){main{padding:25px 14px}.preview{padding:18px;gap:14px}.cover{width:80px;height:80px}.album h2{font-size:17px}}
</style>
</head>
<body><main>
<header><h1>专辑播放按钮 · 扁平方案</h1><p>按推荐顺序排列。六组使用相同的尺寸与内容；可切换背景、调整强调色，悬停或按下按钮查看反馈。</p></header>
<div class="toolbar"><button id="theme" type="button" aria-pressed="false">切换到浅色背景</button><label>强调色 <input id="accent" type="color" value="#1dd55f"></label><button id="reset" type="button">恢复默认颜色</button></div>
<div class="grid" id="grid"></div>
<footer>独立视觉 Demo：按钮只显示交互反馈，不连接曲库或实际播放。专辑封面和内容为示意。</footer>
</main><script>
const options=[
 ['强调色实心','首选','播放动作清晰，随机按钮以柔和中性色配合；视觉直接，也保留主题个性。'],
 ['实心 + 细描边','', '播放保持突出，随机按钮更轻；适合希望两个动作层级更分明的界面。'],
 ['柔和色块','', '用低饱和色块降低视觉重量，更融入专辑背景，但主操作的醒目程度较低。'],
 ['单色实心','', '跟随明暗前景色，安静且稳定；强调色不再承担按钮识别作用。'],
 ['强调色描边','', '界面更通透，播放和随机的视觉重量接近；主操作辨识度相对较弱。'],
 ['中性色 + 彩色图标','', '最克制的处理，只有播放图标使用强调色；适合让封面成为唯一视觉重点。']
];
const playIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5 20 12 7 19.5z"/></svg>';
const shuffleIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 3h3v3M21 3l-5.5 5.5M3 17h2.5c2 0 3.1-.8 4.4-2.5l4.2-5C15.4 7.8 16.5 7 18.5 7H21M18 21h3v-3M21 21l-5.5-5.5M3 7h2.5c2 0 3.1.8 4.4 2.5l1.1 1.3M14 14.3l.5.6c1.3 1.7 2.4 2.1 4 2.1H21"/></svg>';
const grid=document.querySelector('#grid');
options.forEach(([name,badge,description],i)=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="info"><div class="title"><span class="rank">0${i+1}</span>${name}${badge?`<span class="badge">${badge}</span>`:''}</div><p>${description}</p></div><div class="preview s${i+1}"><div class="cover" aria-hidden="true">AURALIS</div><div class="album"><h2>专辑名称</h2><p>艺术家 · 2024</p><div class="actions"><button type="button" class="shuffle" aria-label="随机播放">${shuffleIcon}</button><button type="button" class="play">${playIcon}播放</button></div><div class="feedback" aria-live="polite"></div></div></div>`;card.querySelectorAll('.actions button').forEach(button=>button.addEventListener('click',()=>{card.querySelector('.feedback').textContent=button.classList.contains('play')?'播放按钮已点击':'随机播放按钮已点击'}));grid.append(card)});
const theme=document.querySelector('#theme'),accent=document.querySelector('#accent');theme.addEventListener('click',()=>{const light=theme.getAttribute('aria-pressed')!=='true';theme.setAttribute('aria-pressed',String(light));theme.textContent=light?'切换到深色背景':'切换到浅色背景';document.querySelectorAll('.preview').forEach(el=>el.classList.toggle('light',light))});function updateAccent(){document.querySelectorAll('.preview').forEach(el=>{el.style.setProperty('--accent',accent.value);const c=accent.value.match(/[\da-f]{2}/gi).map(x=>parseInt(x,16));const luminance=c.map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0);el.style.setProperty('--on-accent',luminance>.179?'#121212':'#ffffff')})}accent.addEventListener('input',updateAccent);document.querySelector('#reset').addEventListener('click',()=>{accent.value='#1dd55f';updateAccent()});updateAccent();
</script></body></html>
