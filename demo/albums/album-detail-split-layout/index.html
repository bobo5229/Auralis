<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auralis 专辑详情布局</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color-scheme:dark;--canvas:#586a57;--side:#334a38;--gallery:#465b47;--fg:#f5f4e9;--sub:#d3ddd0;--muted:#b5c9b7;--line:#afc5ad;--select:#ffffff16;--shadow:#102d1c45}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#1d2820;color:var(--fg)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #fff;outline-offset:3px}button:disabled{cursor:default}svg{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.shell{height:100%;display:grid;grid-template-columns:210px minmax(0,1fr) 245px;overflow:hidden}.sidebar,.lyrics{background:var(--side);min-width:0}.sidebar{display:flex;flex-direction:column;padding:25px 15px 18px}.brand{padding:2px 10px 34px;font-size:17px;font-weight:700;letter-spacing:.14em}.nav-section{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:11px 10px 8px}.nav-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:7px;color:var(--sub);font-size:14px}.nav-item.active{background:#ffffff18;color:#fff;font-weight:600}.nav-item svg{width:17px;height:17px}.sidebar-bottom{margin-top:auto;border-top:1px solid #ffffff1d;padding:19px 10px 0;color:var(--sub);font-size:13px}.main{position:relative;min-width:0;min-height:0;overflow:auto;background:var(--canvas)}.topbar{position:absolute;z-index:2;top:16px;left:16px;right:clamp(24px,3.4vw,52px);display:flex;align-items:center;justify-content:space-between}.back,.theme{border:0;background:transparent;display:inline-flex;align-items:center;gap:8px;color:var(--sub);padding:5px;font-size:13px}.back{width:40px;height:40px;padding:0;justify-content:center;border:1px solid #ffffff38;border-radius:50%;background:#16241b66;color:#fff;box-shadow:0 3px 14px #0002;backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2)}.back:hover{background:#16241b99}.theme:hover{color:#fff}.theme{border-radius:50%;padding:8px}.content{width:100%;margin:0;padding:0 clamp(24px,3.4vw,52px) 75px 0}.columns{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(240px,1fr);gap:clamp(28px,3.4vw,56px);align-items:start}.album{position:relative;min-width:0}.cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:0 0 14px 0;box-shadow:0 17px 42px var(--shadow)}.album h1{margin:23px 0 8px 32px;font-size:clamp(23px,2.1vw,31px);letter-spacing:-.04em;line-height:1.18}.artist{margin:0 0 0 32px;color:var(--fg);font-size:15px;font-weight:600}.metadata{margin:10px 0 0 32px;color:var(--sub);font-size:13px;line-height:1.65}.album-controls{display:flex;gap:10px;margin:23px 0 0 32px}.primary,.icon-button{height:40px;border:0;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:9px}.primary{background:#e6ebe2;color:#283b2e;padding:0 20px;font-weight:700}.primary svg{fill:currentColor;stroke:none;width:15px}.icon-button{width:40px;background:#ffffff19;color:#f6f8f2}.primary:hover,.icon-button:hover{filter:brightness(1.08)}.credits{margin:24px 0 0 32px;color:var(--muted);font-size:11px;line-height:1.55}.tracks{min-width:0;padding-top:64px}.track-heading{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 0 22px}.track-heading h2{font-size:17px;line-height:1.3;margin:0;font-weight:700}.track-count{font-size:12px;color:var(--sub);white-space:nowrap}.track-list{display:flex;flex-direction:column}.track{position:relative;min-height:56px;width:100%;display:grid;grid-template-columns:35px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px 8px 6px;border:0;border-radius:7px;background:transparent;text-align:left}.track+.track:before{content:"";position:absolute;top:0;left:6px;right:10px;height:1px;background:var(--line);opacity:.36}.track:hover,.track.selected{background:var(--select)}.track:hover:before,.track.selected:before,.track:hover+.track:before,.track.selected+.track:before{opacity:0}.number{color:var(--sub);font-size:12px;text-align:center;font-variant-numeric:tabular-nums}.track.selected .number{color:#fff}.track-name{min-width:0;font-size:14px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.duration{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}.more{margin-top:60px;padding-top:25px;border-top:1px solid #ffffff2c}.more h2{font-size:17px;margin:0 0 20px}.more-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.more-card{min-width:0}.more-card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.more-card p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600;margin:9px 0 2px}.more-card small{font-size:12px;color:var(--sub)}.lyrics{padding:0 22px;display:flex;flex-direction:column;justify-content:center;gap:21px;font-size:17px;font-weight:650;line-height:1.55}.lyrics p{margin:0;color:#c2d0bd}.lyrics p.current{color:#fff}.lyrics small{color:var(--muted);font-size:11px;font-weight:400;margin-top:12px}.player{position:fixed;bottom:16px;left:calc(210px + 24px);right:calc(245px + 24px);height:64px;display:flex;align-items:center;gap:13px;padding:10px 14px;background:#293b30ed;border:1px solid #ffffff20;border-radius:17px;box-shadow:0 12px 32px #1225164d;backdrop-filter:blur(18px)}.player img{height:42px;width:42px;border-radius:5px;object-fit:cover}.player-meta{min-width:0;flex:1}.player-meta strong,.player-meta span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player-meta strong{font-size:13px}.player-meta span{margin-top:3px;color:#c4d4c6;font-size:11px}.player-controls{display:flex;align-items:center;gap:18px}.player-controls button{border:0;padding:3px;background:transparent}.player-controls .playing svg{fill:#fff;stroke:none;width:21px;height:21px}.progress{height:3px;border-radius:5px;background:#ffffff37;width:clamp(45px,10vw,130px)}.progress:before{content:"";display:block;width:34%;height:100%;background:#d7e4d7;border-radius:inherit}[data-theme="light"]{color-scheme:light;--canvas:#e0e9db;--side:#becdbb;--gallery:#d2dfcd;--fg:#22382a;--sub:#425c48;--muted:#506952;--line:#68836e;--select:#1c40251a;--shadow:#23462925}[data-theme="light"] body{background:#b4c5b4}[data-theme="light"] .nav-item.active{background:#263f2c1c;color:#183220}[data-theme="light"] .lyrics p{color:#546d58}[data-theme="light"] .lyrics p.current{color:#203727}[data-theme="light"] .icon-button{background:#27412d1f;color:#203727}[data-theme="light"] .primary{background:#2f4d35;color:#fff}[data-theme="light"] .track.selected .number{color:#1f3825}[data-theme="light"] .back:hover,[data-theme="light"] .theme:hover{color:#1b3323}
@media(max-width:1100px){.shell{grid-template-columns:72px minmax(0,1fr) 200px}.sidebar{padding-inline:10px}.brand{font-size:0;padding-inline:5px;text-align:center}.brand:after{content:'A';font-size:20px}.nav-item{justify-content:center}.nav-item span,.nav-section,.sidebar-bottom{display:none}.player{left:96px;right:224px}.lyrics{font-size:15px;padding-inline:15px}}
@media(max-width:850px){.shell{grid-template-columns:64px minmax(0,1fr)}.lyrics{display:none}.player{left:88px;right:24px}.columns{grid-template-columns:minmax(0,1fr) minmax(220px,1fr);gap:28px}}
@media(max-width:600px){.shell{grid-template-columns:1fr}.sidebar{display:none}.player{left:16px;right:16px}.columns{grid-template-columns:1fr;gap:34px}.album{position:static;display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);column-gap:18px;align-items:start}.cover{grid-row:1 / span 5}.album h1{margin:4px 0 6px;font-size:22px}.album-controls{margin-top:14px}.credits{grid-column:1 / -1;margin-top:18px}.content{padding-top:0}.album h1,.artist,.metadata,.album-controls{margin-left:0}.credits{margin-left:18px}.tracks{padding-top:0}.more-grid{gap:10px}.player .progress{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/* The artwork and its metadata form a single cover-led surface. */
.player{color:#f5f4e9}[data-theme="light"] .back:hover{color:#fff}.main{scrollbar-width:thin;scrollbar-color:#ffffff45 transparent}
.content{padding:0 0 100px}.columns{gap:0;grid-template-columns:minmax(0,1fr) minmax(240px,1fr);align-items:stretch}
.album{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:clamp(620px,58vw,760px);padding:0 30px 38px;overflow:hidden;text-align:center}
.cover{position:absolute;top:0;left:0;width:100%;height:76%;aspect-ratio:auto;object-fit:cover;object-position:center top;border:0;border-radius:0;box-shadow:none;mask-image:linear-gradient(to right,#000 68%,transparent 100%),linear-gradient(to bottom,#000 56%,transparent 100%);mask-composite:intersect;-webkit-mask-image:linear-gradient(to right,#000 68%,transparent 100%),linear-gradient(to bottom,#000 56%,transparent 100%);-webkit-mask-composite:source-in}
.album-info{position:relative;z-index:1;display:flex;width:100%;flex-direction:column;align-items:center}
.album h1{margin:0 0 7px;font-size:clamp(24px,2.1vw,31px)}.artist{margin:0}.metadata{margin:9px 0 0}.album-controls{margin:20px 0 0;justify-content:center}.credits{margin:15px 0 0}
.tracks{padding:64px clamp(24px,3.4vw,52px) 40px 16px}
.more{margin:0;padding:25px clamp(24px,3.4vw,52px) 30px;background:var(--gallery);border-top:0}.more-grid{grid-template-columns:repeat(3,minmax(0,180px));gap:18px}
@media(max-width:850px){.columns{grid-template-columns:minmax(0,1fr) minmax(220px,1fr);gap:0}.album{min-height:600px}.tracks{padding:64px 24px 30px 12px}}
@media(max-width:600px){.columns{grid-template-columns:1fr}.album{position:relative;display:flex;min-height:560px;padding:0 24px 30px}.cover{height:78%;grid-row:auto}.album h1{margin:0 0 7px}.artist{margin:0}.metadata{margin:9px 0 0}.album-controls{margin:20px 0 0}.credits{margin:15px 0 0}.tracks{padding:28px 24px 34px}.more{padding:24px 24px 30px}}
/* Follow the reference: square artwork, compact tracks, and credits below the list. */
.cover{height:auto;aspect-ratio:1 / 1;object-fit:contain;mask-image:linear-gradient(to right,#000 75%,transparent 100%),linear-gradient(to bottom,#000 70%,transparent 100%);-webkit-mask-image:linear-gradient(to right,#000 75%,transparent 100%),linear-gradient(to bottom,#000 70%,transparent 100%)}
.track-heading{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.tracks{padding-top:66px}.track{min-height:44px;padding-block:5px}.track-name{font-weight:500}.track-list{border-top:1px solid color-mix(in srgb,var(--line) 32%,transparent)}.track.selected{background:transparent}.track.selected:before{opacity:.36}.track.selected+.track:before{opacity:.36}.track.selected .number{position:relative}.track.selected .number:before{content:'';position:absolute;width:6px;height:6px;border-radius:50%;background:currentColor;left:-3px;top:50%;transform:translateY(-50%)}.track:hover{background:var(--select)}
.album-controls .icon-button{order:-1;border-radius:50%;width:36px;height:36px}.album-controls .primary{height:36px;min-width:106px;border-radius:999px}.album-controls{align-items:center;gap:9px}
.release-details{margin:10px 0 0;color:var(--sub);font-size:12px;line-height:1.55;text-align:center}.release-details p{margin:0}
@media(max-width:600px){.cover{height:auto;aspect-ratio:1 / 1;mask-image:linear-gradient(to right,#000 75%,transparent 100%),linear-gradient(to bottom,#000 45%,transparent 82%);-webkit-mask-image:linear-gradient(to right,#000 75%,transparent 100%),linear-gradient(to bottom,#000 45%,transparent 82%)}.tracks{padding-top:28px}.release-details{margin-top:10px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" aria-label="导航示意">
    <div class="brand">AURALIS</div><div class="nav-section">音乐收藏</div>
    <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>曲库</span></div>
    <div class="nav-item active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/></svg><span>专辑</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 6h10M4 11h10M4 16h7M18 11v8m-3-2 3 2 3-2"/></svg><span>播放队列</span></div>
    <div class="nav-section" style="margin-top:30px">我的收藏</div><div class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 20S4 15 4 9a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 6-8 11-8 11z"/></svg><span>喜爱的音乐</span></div><div class="sidebar-bottom">♫　专注聆听</div>
  </aside>
  <main class="main" id="main">
    <div class="topbar"><button class="back" type="button" aria-label="返回专辑列表" title="返回专辑列表（布局示意）"><svg viewBox="0 0 24 24"><path d="M19 12H5m7-7-7 7 7 7"/></svg></button><button class="theme" type="button" aria-label="切换深浅主题" title="切换深浅主题"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11 1.5 1.5M19 5l-1.5 1.5m-11 11L5 19"/></svg></button></div>
    <div class="content"><div class="columns">
      <section class="album" aria-label="专辑信息"><img class="cover" src="../assets/album-sleeve-cover.webp" alt="Feel My Rhythm 专辑封面"><div class="album-info"><h1>Feel My Rhythm</h1><p class="artist">Red Velvet</p><p class="metadata">2022　流行</p><div class="release-details"><p>2022 年 3 月 21 日</p><p>6 首歌曲　20 分钟</p><p>℗ 2022 SM Entertainment</p></div><div class="album-controls"><button class="primary" type="button" aria-label="切换播放状态（布局预览）"><svg viewBox="0 0 24 24"><path d="M7 4.5 20 12 7 19.5z"/></svg><span>播放</span></button><button class="icon-button" type="button" aria-label="随机播放（布局预览）"><svg viewBox="0 0 24 24"><path d="M17 3h4v4M3 17h3c5 0 7-10 12-10h3M17 21h4v-4M3 7h3c2 0 3.5 2 5 4m3 4c1 1.2 2.2 2 4 2h3"/></svg></button></div></div></section>
      <section class="tracks" aria-label="曲目"><div class="track-heading"><h2>曲目</h2><span class="track-count">6 首歌曲</span></div><div class="track-list">
        <button class="track selected" data-name="Feel My Rhythm" type="button"><span class="number">01</span><span class="track-name">Feel My Rhythm</span><span class="duration">3:30</span></button>
        <button class="track" data-name="Rainbow Halo" type="button"><span class="number">02</span><span class="track-name">Rainbow Halo</span><span class="duration">3:28</span></button>
        <button class="track" data-name="Beg For Me" type="button"><span class="number">03</span><span class="track-name">Beg For Me</span><span class="duration">3:12</span></button>
        <button class="track" data-name="BAMBOLEO" type="button"><span class="number">04</span><span class="track-name">BAMBOLEO</span><span class="duration">3:21</span></button>
        <button class="track" data-name="Good, Bad, Ugly" type="button"><span class="number">05</span><span class="track-name">Good, Bad, Ugly</span><span class="duration">3:22</span></button>
        <button class="track" data-name="In My Dreams" type="button"><span class="number">06</span><span class="track-name">In My Dreams</span><span class="duration">3:14</span></button>
      </div></section></div><section class="more" aria-label="更多专辑"><h2>更多作品</h2><div class="more-grid"><div class="more-card"><img src="../../playback/palette-comparison/assets/melodrama.jpg" alt=""><p>专辑封面示例</p><small>2017</small></div><div class="more-card"><img src="../../playback/palette-comparison/assets/1989.jpg" alt=""><p>专辑封面示例</p><small>2014</small></div><div class="more-card"><img src="../../playback/palette-comparison/assets/post.jpg" alt=""><p>专辑封面示例</p><small>1995</small></div></div></section></div>
  </main>
  <aside class="lyrics" aria-label="歌词区域示意"><p>跟随音乐的旋律</p><p class="current">在这一刻自由流动</p><p>让时间慢慢停留</p><p>聆听每一个瞬间</p><small>歌词内容示意</small></aside>
</div>
<div class="player" aria-label="播放栏示意"><img src="../assets/album-sleeve-cover.webp" alt=""><div class="player-meta"><strong id="playing-title">Feel My Rhythm</strong><span>Red Velvet</span></div><div class="player-controls"><div class="progress" aria-hidden="true"></div><button class="playing" type="button" aria-label="切换播放状态（布局预览）"><svg viewBox="0 0 24 24"><path d="M7 4.5 20 12 7 19.5z"/></svg></button></div></div>
<script>
const theme = document.querySelector('.theme');
theme.addEventListener('click', () => { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark' });
document.querySelectorAll('.track').forEach(track => track.addEventListener('click', () => { document.querySelectorAll('.track').forEach(item => item.classList.remove('selected')); track.classList.add('selected'); document.querySelector('#playing-title').textContent = track.dataset.name }));
const mainPlay = document.querySelector('.primary'); const miniPlay = document.querySelector('.playing'); let playing = false;
function togglePlay() { playing = !playing; mainPlay.querySelector('span').textContent = playing ? '暂停' : '播放'; const path = playing ? 'M7 5h4v14H7z M14 5h4v14h-4z' : 'M7 4.5 20 12 7 19.5z'; mainPlay.querySelector('path').setAttribute('d',path); miniPlay.querySelector('path').setAttribute('d',path) }
mainPlay.addEventListener('click', togglePlay); miniPlay.addEventListener('click', togglePlay);
document.querySelector('.icon-button').addEventListener('click', () => { const tracks = [...document.querySelectorAll('.track')]; tracks[Math.floor(Math.random() * tracks.length)].click() });
</script>
</body>
</html>
