  <title>Auralis</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { background: #161b1e; overflow: hidden; }
    .canvas { width: 100%; height: 100%; display: grid; grid-template-columns: clamp(92px, 17vw, 240px) minmax(0, 1fr) clamp(92px, 23vw, 320px); }
    .side, .center { transition: background-color 650ms ease; }
    .side { background: rgb(40 48 51); }
    .center { position: relative; background: rgb(67 78 81); }
    .upload { position: absolute; top: clamp(36px, 8vh, 80px); left: clamp(24px, 5vw, 70px); width: clamp(130px, 22vw, 270px); aspect-ratio: 1; padding: 0; border: 0; border-radius: 16px; overflow: hidden; cursor: pointer; background: #697675; box-shadow: 0 16px 42px #0003; }
    .upload:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .upload img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .upload-icon { position: absolute; right: 12px; bottom: 12px; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; color: white; background: #161b1ecc; opacity: .85; transition: opacity 160ms ease, transform 160ms ease; }
    .upload:hover .upload-icon, .upload:focus-visible .upload-icon { opacity: 1; transform: scale(1.08); }
    .upload-icon svg { width: 19px; height: 19px; }
    input { display: none; }
    @media (max-width: 600px) { .canvas { grid-template-columns: 15% minmax(0,1fr) 20%; } .upload { left: 12%; width: 68%; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
