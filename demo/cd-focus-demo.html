<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auralis · CD 专辑聚焦 Demo</title>
    <style>
      @font-face {
        font-family: 'Auralis Desktop Lyrics SC';
        src: url('../src/renderer/assets/fonts/GenRyuMin2TC-otf/GenRyuMin2TC-R.woff2')
          format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Auralis Sans SC';
        src: url('../src/renderer/assets/fonts/OPPO_Sans/OPPO_Sans_4.0.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      .page {
        --serif: Georgia, 'Auralis Desktop Lyrics SC', 'SimSun', 'Yu Mincho', serif;
        height: 100dvh;
        position: relative;
        overflow: hidden;
        background: #eeeeec;
        color: #292929;
        font:
          13px Inter,
          'Auralis Sans SC',
          system-ui,
          sans-serif;
        color-scheme: light;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: 1px solid #bdbdb9;
        background: transparent;
        border-radius: 3px;
        padding: 10px 14px;
      }
      button:hover:not(:disabled) {
        background: #e1e1de;
      }
      button:focus-visible {
        outline: 2px solid #292929;
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .back {
        position: absolute;
        left: 24px;
        top: 16px;
        width: 32px;
        height: 32px;
        padding: 0;
        border-color: transparent;
        z-index: 8;
      }
      .info {
        position: absolute;
        top: 64px;
        left: 32px;
        width: min(320px, 29vw);
        max-height: 34vh;
        overflow-y: auto;
        scrollbar-width: thin;
        z-index: 5;
      }
      .title-row {
        display: flex;
        align-items: flex-end;
        gap: 16px;
        padding-bottom: 10px;
        border-bottom: 1px solid #8e8e88;
      }
      h1 {
        flex: 1;
        min-width: 0;
        margin: 0;
        padding-bottom: 3px;
        font: italic 400 30px/1.25 var(--serif);
        font-synthesis: none;
        overflow-wrap: anywhere;
      }
      .count {
        flex-shrink: 0;
        padding-bottom: 6px;
        color: #55554f;
        font: 11px var(--serif);
      }
      dl {
        margin: 0;
      }
      .row {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        align-items: start;
        gap: 18px;
        padding: 8px 0;
      }
      .row + .row {
        border-top: 1px solid #aaa9a3;
      }
      dt {
        font-size: 10px;
        color: #62625b;
        line-height: 1.7;
      }
      dd {
        margin: 0;
        font: 12px/1.5 var(--serif);
        text-align: right;
        overflow-wrap: anywhere;
      }
      .copyright {
        font-size: 11px;
      }
      .stage {
        position: absolute;
        inset: 56px 0 78px;
      }
      .position {
        position: absolute;
        left: 0;
        top: 0;
        width: 400px;
        height: 400px;
        transform-origin: 0 0;
        pointer-events: none;
      }
      .hover {
        width: 100%;
        height: 100%;
        transition: transform 180ms ease-out;
      }
      .plane {
        position: relative;
        width: 400px;
        height: 400px;
      }
      .wave-ring {
        position: absolute;
        left: -28px;
        top: -28px;
        width: 456px;
        height: 456px;
        overflow: visible;
        pointer-events: none;
        opacity: 0;
      }
      .wave-ring path {
        fill: none;
        stroke-width: 1.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .wave-track {
        stroke: #b7b7b0;
      }
      .wave-progress {
        stroke: #62625b;
      }
      .playback-preview {
        position: absolute;
        left: 50%;
        bottom: 80px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 8;
        color: #62625b;
        font-size: 11px;
      }
      .playback-preview[hidden] {
        display: none;
      }
      .playback-preview input {
        width: 130px;
        accent-color: #62625b;
      }
      .playback-preview select {
        background: #eeeeec;
        color: inherit;
        border: 1px solid #bdbdb9;
      }
      .disc {
        display: block;
        position: relative;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: #aaa !important;
        isolation: isolate;
        pointer-events: auto;
        mask-image: radial-gradient(circle, transparent 0 6.8%, #000 7.1%);
        box-shadow: inset 0 0 0 2px #858586;
      }
      .art {
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        overflow: hidden;
        background: conic-gradient(from 35deg, #777d81, #bdc1bf, #666e72, #a7afaf, #777d81);
      }
      .art img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .disc > * {
        pointer-events: none;
      }
      .disc::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 1;
        border-radius: 50%;
        background: linear-gradient(120deg, #fff3, transparent 30%, #0001 65%, #fff2);
        box-shadow:
          inset 1px 1px 0 2px #ffffff80,
          inset -2px -2px 0 3px #42424280,
          inset 0 0 0 5px #dadbd550;
      }
      .hub {
        position: absolute;
        z-index: 2;
        width: 25%;
        height: 25%;
        left: 37.5%;
        top: 37.5%;
        border-radius: 50%;
        background: conic-gradient(
          from 30deg,
          #bdc1c6,
          #e2e4e4,
          #a0a6b1,
          #ccd5d8,
          #eeece8,
          #989da6,
          #bdc1c6
        );
        box-shadow:
          0 0 0 2px #eeeeee70,
          0 0 0 7px #b7b7b744,
          inset 0 0 0 3px #888b9290;
      }
      .hub::after {
        content: '';
        position: absolute;
        inset: 14%;
        border-radius: 50%;
        border: 5px solid #f8f8f890;
        box-shadow: 0 0 0 2px #6c747b60;
      }
      .tracks {
        position: absolute;
        right: 32px;
        top: 24%;
        bottom: 110px;
        width: min(320px, 23vw);
        display: flex;
        flex-direction: column;
        z-index: 6;
        opacity: 0;
        visibility: hidden;
      }
      .tracks-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 14px;
        border-bottom: 1px solid #8e8e88;
      }
      h2 {
        margin: 0;
        font: 400 20px/1.25 var(--serif);
      }
      .mode {
        padding: 4px 0 4px 8px;
        border: 0;
        color: #62625b;
        font-size: 11px;
      }
      .mode span {
        padding-left: 6px;
      }
      .track-scroll {
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
        flex: 1;
        min-height: 0;
        padding-right: 5px;
      }
      .track-scroll::-webkit-scrollbar {
        display: none;
      }
      .disc-heading {
        margin: 22px 0 9px;
        color: #62625b;
        font: 400 11px var(--serif);
        letter-spacing: 0.08em;
      }
      .track {
        width: 100%;
        height: 64px;
        display: grid;
        align-items: center;
        grid-template-columns: 25px minmax(0, 1fr);
        text-align: left;
        gap: 12px;
        border: 0;
        border-top: 1px solid transparent;
        border-radius: 0;
        padding: 0 6px;
      }
      .track + .track {
        border-top: 1px solid #aaa9a333;
      }
      .track-number {
        color: #77776f;
        font: 11px/1.7 var(--serif);
        font-variant-numeric: tabular-nums;
      }
      .track-detail {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
        min-width: 0;
      }
      .track-title,
      .track-artist {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .track-title {
        flex: 0 1 auto;
        font: 400 14px/1.5 var(--serif);
      }
      .track-artist {
        flex: 0 1 auto;
        color: #77776f;
        font: 11px/1.5 var(--serif);
      }
      .track[aria-current='true'] .track-title {
        text-decoration: underline;
        text-underline-offset: 4px;
        text-decoration-color: #8e8e88;
      }
      footer {
        position: absolute;
        inset: auto 24px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        z-index: 7;
      }
      .hint {
        color: #62625f;
        font-size: 12px;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      .demo-label {
        position: absolute;
        left: 32px;
        bottom: 68px;
        color: #85857d;
        font-size: 10px;
        pointer-events: none;
      }
      @media (max-width: 800px) {
        .info {
          left: 24px;
        }
        h1 {
          font-size: 26px;
        }
        .row {
          gap: 8px;
        }
        .tracks {
          right: 20px;
          width: 24vw;
        }
        .tracks-heading {
          flex-wrap: wrap;
        }
        .track {
          gap: 5px;
          grid-template-columns: 20px minmax(0, 1fr);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hover {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page" id="page">
      <button class="back" id="back" aria-label="返回 CD 浏览" title="返回 CD 浏览 · Esc">←</button>
      <div class="stage" id="stage" aria-label="CD 专辑浏览"></div>
      <aside class="info">
        <div class="title-row">
          <h1 id="album-title"></h1>
          <span class="count" id="count"></span>
        </div>
        <dl>
          <div class="row">
            <dt>专辑艺术家</dt>
            <dd id="artist"></dd>
          </div>
          <div class="row">
            <dt>发行日期</dt>
            <dd>2026-09-22</dd>
          </div>
          <div class="row">
            <dt>版权信息</dt>
            <dd class="copyright">Auralis · Demo Collection</dd>
          </div>
        </dl>
      </aside>
      <section class="tracks" id="tracks" aria-labelledby="tracks-title" inert>
        <div class="tracks-heading">
          <h2 id="tracks-title">曲目</h2>
          <button class="mode" id="mode" title="切换播放模式">专辑循环<span>↻</span></button>
        </div>
        <div class="track-scroll" id="track-list"></div>
      </section>
      <div class="demo-label">交互 Demo · 示例曲目，不播放音频</div>
      <div id="playback-preview" class="playback-preview" hidden>
        <button id="pause">暂停</button>
        <input
          id="seek"
          type="range"
          min="0"
          max="100"
          step="0.1"
          value="0"
          aria-label="模拟播放进度"
        />
        <span id="progress-label">0 / 180 秒</span>
        <select id="speed" aria-label="模拟播放速度">
          <option value="1">1× 预览</option>
          <option value="6" selected>6× 预览</option>
          <option value="12">12× 预览</option>
        </select>
      </div>
      <footer>
        <span class="hint" id="hint" role="status">点击中心 CD，展开曲目</span>
        <div class="actions" id="browse-controls">
          <button id="previous">← 上一张</button><button id="next">下一张 →</button>
        </div>
      </footer>
    </main>
    <script src="cd-startup-assets.js"></script>
    <script src="cd-focus-runtime.js"></script>
    <script src="cd-focus-demo.js"></script>
  </body>
</html>
