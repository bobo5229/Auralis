<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>声迹 · 全息浮现动效</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #07080c; color: #dce1e8; font-family: "Microsoft YaHei", sans-serif; display: grid; place-items: center; }
    main { width: min(800px, 100%); padding: 16px 20px 36px; text-align: center; }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 800 / 600; }
    .controls { display: flex; justify-content: center; gap: 12px; align-items: center; flex-wrap: wrap; }
    button, select { font: inherit; font-size: 14px; color: #dce1e8; background: #14161c; border: 1px solid #343841; padding: 11px 20px; border-radius: 4px; cursor: pointer; }
    button:hover, select:hover { background: #20232b; }
    button:focus-visible, select:focus-visible { outline: 2px solid #9be3ec; outline-offset: 4px; }
    p { margin: 20px 0 0; color: #919aa9; font-size: 13px; line-height: 1.8; }
    ::selection { background: #405966; color: white; }
    @media (max-width: 500px) { main { padding-inline: 8px; } }
  </style>
</head>
<body>
  <main>
    <canvas id="scene" width="1600" height="1200" role="img" aria-label="专辑封面从哑光黑色托槽中，由下向上扫描生成的全息投影动画"></canvas>
    <div class="controls">
      <button id="replay" type="button">重播投影</button>
      <select id="speed" aria-label="播放速度">
        <option value="1">正常速度 · 1.5 秒</option>
        <option value="0.4">慢速观察 · 3.75 秒</option>
      </select>
    </div>
    <p id="status" aria-live="polite">正在准备封面</p>
  </main>
  <script src="../albums/cd-startup-assets.js"></script>
  <script>
    const canvas = document.querySelector('#scene');
    const ctx = canvas.getContext('2d');
    const speed = document.querySelector('#speed');
    const status = document.querySelector('#status');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const cover = document.createElement('canvas');
    cover.width = cover.height = 640;
    const art = cover.getContext('2d');
    const photo = new Image();
    const clamp = (n) => Math.max(0, Math.min(1, n));
    const ease = (n) => n * n * (3 - 2 * n);
    let frame = 0;
    let start = 0;
    let ready = false;

    function polygon(points, fill) {
      ctx.beginPath();
      points.forEach(([x,y], i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
      ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    }

    function draw(progress, signalDip = 0) {
      ctx.setTransform(2, 0, 0, 2, 0, 0);
      ctx.clearRect(0, 0, 800, 600);
      const x = 245, top = 108, size = 310, bottom = top + size;
      const scan = bottom - size * ease(clamp((progress - 0.08) / 0.76));
      const energy = Math.sin(Math.PI * clamp(progress / 0.98));
      const settle = ease(clamp((progress - 0.72) / 0.28));
      // Distortion belongs to reconstruction; it fades out before the final flash.
      const distortion = progress > 0 && progress < 1
        ? Math.sin(Math.PI * progress) ** 2 * (.35 + .65 * Math.sin(progress * 24) ** 2)
        : 0;

      // Ground contact and rear half of the matte acrylic slot.
      const shadow = ctx.createRadialGradient(400, 440, 10, 400, 440, 195);
      shadow.addColorStop(0, 'rgba(0,0,0,.8)'); shadow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.save(); ctx.translate(0, 350); ctx.scale(1, .2);
      ctx.fillStyle = shadow; ctx.fillRect(150, 200, 500, 400); ctx.restore();
      polygon([[289,412],[505,412],[517,427],[277,427]], '#080808');

      if (energy > 0) {
        const beam = ctx.createLinearGradient(0, scan, 0, bottom + 8);
        beam.addColorStop(0, `rgba(100,224,238,${energy * .07})`);
        beam.addColorStop(1, `rgba(100,224,238,${energy * .22})`);
        polygon([[289,bottom + 6],[x - 5,scan],[x + size + 5,scan],[511,bottom + 6]], beam);
      }

      // Reveal in place: each scan band resolves from translucent signal to cover art.
      ctx.save();
      // Let partially reconstructed bands stretch beyond the original silhouette.
      const overflow = distortion * 70;
      ctx.beginPath(); ctx.rect(x - overflow, scan, size + overflow * 2, bottom - scan); ctx.clip();
      for (let y = 0; y < size; y += 2) {
        const distance = top + y - scan;
        const resolved = clamp(distance / 75);
        const flicker = progress < .72 && Math.sin(progress * 83) > .92 ? .82 : 1;
        ctx.globalAlpha = (settle + (1 - settle) * (.38 + .62 * resolved)) * flicker * (1 - .45 * signalDip);
        const offset = distance < 24 && progress < .84 ? Math.sin(y * 1.7 + progress * 160) * 3 * energy : 0;
        const height = y / size;
        const anchor = clamp((1 - height) / .12);
        const bandShift = height > .19 && height < .31 ? -24
          : height > .43 && height < .59 ? 34
          : height > .70 && height < .79 ? -18 : 0;
        const pull = distortion * anchor;
        const stretch = size * .18 * Math.exp(-(((height - .5) / .2) ** 2)) * pull;
        const left = x + offset + (bandShift + Math.sin(height * 19) * 7) * pull - stretch / 2;
        const width = size + stretch;
        ctx.drawImage(cover, 0, y / size * 640, 640, 2 / size * 640, left, top + y, width, 2.2);
        ctx.globalAlpha = 1;
        ctx.fillStyle = `rgba(103,228,243,${energy * .12 + signalDip * .1})`;
        ctx.fillRect(left, top + y, width, 2);
        if (y % 4 === 0) {
          ctx.fillStyle = `rgba(0,0,0,${energy * .25 + signalDip * .18})`;
          ctx.fillRect(left, top + y, width, 1);
        }
      }
      ctx.restore();

      // Temporary scan head and a soft source glow; both disappear at completion.
      if (progress > .025 && progress < .98) {
        ctx.save();
        const head = ctx.createLinearGradient(0, scan - 9, 0, scan + 16);
        head.addColorStop(0, 'rgba(110,236,248,0)');
        head.addColorStop(.36, `rgba(164,246,255,${energy * .8})`);
        head.addColorStop(1, 'rgba(110,236,248,0)');
        ctx.fillStyle = head; ctx.fillRect(x - 3, scan - 9, size + 6, 25);
        ctx.fillStyle = `rgba(211,253,255,${energy * .95})`;
        ctx.fillRect(x, scan, size, 1);
        ctx.shadowColor = '#7be2ed'; ctx.shadowBlur = 14 * energy;
        ctx.fillStyle = `rgba(123,226,237,${energy * .7})`;
        ctx.fillRect(291, bottom + 1, 218, 1.5);
        ctx.restore();
      }
      // Front lip overlaps the sleeve, so it stays seated in the slot.
      polygon([[289,416],[511,416],[517,430],[277,430]], '#080808');
      polygon([[277,430],[517,430],[517,439],[277,439]], '#050505');
      polygon([[511,416],[517,430],[517,439],[511,425]], '#060606');
    }

    function tick(now) {
      const elapsed = (now - start) * Number(speed.value);
      const progress = clamp(elapsed / 1200);
      // Once the undistorted cover is complete, pause 60 ms and flash once.
      const pulse = clamp((elapsed - 1260) / 200);
      const signalDip = pulse > 0 && pulse < 1 ? Math.sin(Math.PI * pulse) ** 2 : 0;
      draw(progress, signalDip);
      if (elapsed < 1500) frame = requestAnimationFrame(tick);
      else { status.textContent = '投影完成 · 封面保持清晰稳定'; }
    }
    function replay() {
      if (!ready) return;
      cancelAnimationFrame(frame);
      status.textContent = '从托槽向上扫描 · 图像逐渐显现';
      start = performance.now(); draw(0); frame = requestAnimationFrame(tick);
    }
    function prepare() {
      art.fillStyle = '#ddd8c9'; art.fillRect(0,0,640,640);
      if (photo.naturalWidth) art.drawImage(photo, 22, 22, 596, 486);
      art.fillStyle = '#191b20'; art.font = '500 39px Georgia';
      art.fillText('AFTERIMAGE', 28, 561);
      art.font = '15px sans-serif'; art.fillText('LIGHT / MEMORY / 01', 30, 602);
      ready = true;
      if (reducedMotion.matches) { draw(1); status.textContent = '已减少动态效果 · 点击重播可预览'; }
      else replay();
    }
    photo.onload = prepare;
    photo.onerror = prepare;
    photo.src = SAMPLE_COVERS[0];
    document.querySelector('#replay').addEventListener('click', replay);
    speed.addEventListener('change', replay);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { cancelAnimationFrame(frame); if (ready) { draw(1); status.textContent = '投影完成 · 封面保持清晰稳定'; } }
    });
  </script>
</body>
</html>
