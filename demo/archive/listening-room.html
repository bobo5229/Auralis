<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auralis · 声迹听音室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Italiana&family=Noto+Serif+SC:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #100c09;
        --lamp: #e2b16a;
        --filament: #f0c27a;
        --copper: #c4894a;
        --paper: #ead7bf;
        --ink: #2c2118;
        --ink-soft: #6a5644;
        --brass: #c4a574;
        --room-rgb: 196, 137, 74;
        --tilt-x: 0deg;
        --tilt-y: 0deg;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        overflow: hidden;
        background: var(--void);
        color: #f3e6d4;
        font-family: 'Noto Serif SC', 'Songti SC', serif;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--brass);
        outline-offset: 3px;
      }
      ::selection {
        background: color-mix(in srgb, var(--copper) 55%, black);
        color: #fff6e8;
      }

      .room {
        position: relative;
        isolation: isolate;
        height: 100%;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        padding: 22px 40px 20px;
        overflow: hidden;
        perspective: 1600px;
        background:
          radial-gradient(90% 70% at 50% -10%, rgb(var(--room-rgb) / 0.28), transparent 58%),
          radial-gradient(50% 40% at 80% 110%, rgb(var(--room-rgb) / 0.12), transparent 60%),
          linear-gradient(180deg, #1a120c 0%, var(--void) 42%, #0c0907 100%);
        transition: background 700ms ease;
      }
      .room::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 8;
        background: radial-gradient(120% 80% at 50% 40%, transparent 42%, rgba(0, 0, 0, 0.5) 100%);
      }
      .lamp {
        position: absolute;
        top: -90px;
        left: 50%;
        width: 320px;
        height: 240px;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 1;
        background: radial-gradient(ellipse at 50% 80%, rgb(var(--room-rgb) / 0.5), transparent 70%);
        filter: blur(10px);
      }

      .stage {
        position: relative;
        z-index: 3;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-height: 0;
        height: 100%;
        transform-style: preserve-3d;
        transform: rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
        transition: transform 180ms ease-out;
      }

      .inscription {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        padding: 0 8px 18px;
        transform: translateZ(48px);
      }
      .plaque {
        position: relative;
        transform-style: preserve-3d;
        padding: 10px 18px 12px 16px;
        background: linear-gradient(180deg, #3a2a1c, #24180f);
        box-shadow:
          10px 18px 28px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 220, 170, 0.22);
      }
      .plaque::after {
        content: '';
        position: absolute;
        right: -10px;
        top: 8px;
        bottom: 8px;
        width: 10px;
        background: linear-gradient(180deg, #5a4030, #1a120c);
        transform: rotateY(70deg);
        transform-origin: left center;
      }
      .year {
        font-family: Italiana, 'Noto Serif SC', serif;
        font-size: clamp(48px, 6vw, 72px);
        line-height: 0.9;
        letter-spacing: 0.04em;
        color: #f7ead8;
        text-shadow: 0 2px 0 #1a1008, 0 10px 18px rgba(0, 0, 0, 0.45);
      }
      .year-switch {
        display: flex;
        gap: 10px;
        margin-top: 8px;
      }
      .year-switch button {
        font-family: Italiana, serif;
        font-size: 15px;
        letter-spacing: 0.12em;
        color: color-mix(in srgb, var(--lamp) 55%, #6a5844);
      }
      .year-switch button.is-on {
        color: var(--lamp);
      }
      .census {
        text-align: right;
        transform: translateZ(36px);
      }
      .genre-word {
        font-family: Italiana, serif;
        font-size: clamp(28px, 3.4vw, 42px);
        letter-spacing: 0.22em;
        color: var(--lamp);
        text-shadow: 0 8px 18px rgb(var(--room-rgb) / 0.35);
      }
      .census-line {
        margin-top: 8px;
        font-size: 12px;
        letter-spacing: 0.18em;
        color: color-mix(in srgb, var(--lamp) 70%, #8a7358);
      }
      .spines {
        margin-top: 14px;
        display: flex;
        justify-content: flex-end;
        align-items: flex-end;
        gap: 5px;
        height: 42px;
        perspective: 420px;
      }
      .spines i {
        display: block;
        width: 9px;
        border-radius: 1px 1px 0 0;
        transform: rotateX(-18deg) rotateY(-18deg);
        transform-origin: 50% 100%;
        box-shadow:
          3px 6px 8px rgba(0, 0, 0, 0.45),
          inset -2px 0 0 rgba(0, 0, 0, 0.35),
          inset 1px 0 0 rgba(255, 255, 255, 0.25);
      }

      .field {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 0fr;
        align-items: stretch;
        gap: 0;
        transform-style: preserve-3d;
        transition: grid-template-columns 520ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .room.is-day .field {
        grid-template-columns: minmax(0, 1fr) minmax(270px, 310px);
        gap: 8px;
      }

      .wall-stage {
        min-width: 0;
        display: flex;
        align-items: center;
        perspective: 1400px;
        padding: 8px 18px 12px 6px;
      }
      .wall-board {
        position: relative;
        width: 100%;
        transform-style: preserve-3d;
        transform: rotateX(14deg) rotateY(-8deg);
        transform-origin: 50% 80%;
        transition: transform 280ms ease, filter 400ms ease;
      }
      .room.is-day .wall-board {
        filter: brightness(0.78);
        transform: rotateX(14deg) rotateY(-14deg) translateZ(-24px);
      }
      .wall-face {
        position: relative;
        padding: 18px 18px 22px 22px;
        background:
          linear-gradient(90deg, rgba(255, 220, 170, 0.07), transparent 8%),
          linear-gradient(180deg, #3a2a1e 0%, #24180f 55%, #1a120c 100%);
        box-shadow:
          0 28px 48px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 220, 180, 0.16),
          inset 0 -8px 16px rgba(0, 0, 0, 0.35);
      }
      .wall-face::before {
        content: '';
        position: absolute;
        inset: 8px;
        border: 1px solid rgba(196, 165, 116, 0.16);
        pointer-events: none;
      }
      .wall-side {
        position: absolute;
        top: 10px;
        right: -16px;
        width: 16px;
        height: calc(100% - 20px);
        background: linear-gradient(180deg, #4a3424, #120c08);
        transform: rotateY(72deg);
        transform-origin: left center;
      }
      .wall-bottom {
        position: absolute;
        left: 12px;
        right: 8px;
        bottom: -14px;
        height: 14px;
        background: linear-gradient(180deg, #1a120c, #0a0705);
        transform: rotateX(78deg);
        transform-origin: top center;
        box-shadow: 0 18px 24px rgba(0, 0, 0, 0.5);
      }
      .months {
        display: grid;
        margin: 0 8px 12px 6px;
        font-size: 11px;
        letter-spacing: 0.16em;
        color: color-mix(in srgb, var(--lamp) 50%, #5c4a38);
      }
      .heatmap {
        display: grid;
        grid-auto-flow: column;
        grid-template-rows: repeat(7, 1fr);
        gap: 6px;
        height: min(38vh, 320px);
        min-height: 180px;
        transform-style: preserve-3d;
      }
      .cell {
        position: relative;
        aspect-ratio: 1;
        min-height: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 28%, #2c2118, #120e0a 62%);
        box-shadow:
          inset 0 2px 3px rgba(255, 255, 255, 0.08),
          inset 0 -3px 4px rgba(0, 0, 0, 0.7),
          0 3px 0 #0a0705;
        transform: translateZ(2px);
      }
      .cell[data-level='1'] {
        background: radial-gradient(circle at 32% 28%, #8a6238, #3a2414 70%);
        box-shadow: 0 0 8px rgb(var(--room-rgb) / 0.28), 0 3px 0 #0a0705;
        transform: translateZ(5px);
      }
      .cell[data-level='2'] {
        background: radial-gradient(circle at 32% 28%, #d4a056, #5a3418 70%);
        box-shadow: 0 0 10px rgb(var(--room-rgb) / 0.45), 0 3px 0 #0a0705;
        transform: translateZ(8px);
      }
      .cell[data-level='3'] {
        background: radial-gradient(circle at 32% 28%, #f0c27a, #8a4a18 72%);
        box-shadow: 0 0 14px rgb(var(--room-rgb) / 0.6), 0 3px 0 #0a0705;
        transform: translateZ(12px);
      }
      .cell[data-level='4'] {
        background: radial-gradient(circle at 32% 28%, #fff1d0, var(--filament) 46%, #c4894a);
        box-shadow:
          0 0 16px rgb(var(--room-rgb) / 0.85),
          0 0 2px #fff6e0,
          0 3px 0 #0a0705;
        transform: translateZ(16px);
      }
      .cell.is-future {
        background: transparent;
        box-shadow: inset 0 0 0 1px rgba(196, 165, 116, 0.1);
        transform: none;
        pointer-events: none;
      }
      .cell.is-empty-pad {
        visibility: hidden;
        pointer-events: none;
      }
      .cell.is-on {
        box-shadow:
          0 0 0 2px #fff1d4,
          0 0 18px rgb(var(--room-rgb) / 0.9);
      }
      .cell:hover:not(.is-future):not(.is-empty-pad) {
        transform: translateZ(22px) scale(1.18);
        z-index: 3;
      }

      .setlist {
        position: relative;
        width: 0;
        opacity: 0;
        overflow: visible;
        pointer-events: none;
        perspective: 900px;
        transform: translateZ(80px);
        transition:
          width 520ms cubic-bezier(0.22, 1, 0.36, 1),
          opacity 400ms ease;
      }
      .room.is-day .setlist {
        width: auto;
        opacity: 1;
        pointer-events: auto;
      }
      .clipboard {
        position: relative;
        height: min(420px, 100%);
        transform-style: preserve-3d;
        transform: rotateY(-18deg) rotateX(6deg) translateY(8px);
        transform-origin: 50% 0;
        filter: drop-shadow(12px 22px 24px rgba(0, 0, 0, 0.55));
      }
      .clip {
        position: absolute;
        top: -12px;
        left: 50%;
        z-index: 3;
        width: 42px;
        height: 28px;
        transform: translateX(-50%) translateZ(18px);
        background: linear-gradient(180deg, #efe0b4, #9a7848 55%, #6d542e);
        border-radius: 4px 4px 3px 3px;
        box-shadow: 0 6px 10px rgba(0, 0, 0, 0.4);
      }
      .clip::before {
        content: '';
        position: absolute;
        inset: 5px 8px auto;
        height: 6px;
        border-radius: 1px;
        background: #3a2a18;
      }
      .clip::after {
        content: '';
        position: absolute;
        left: 10px;
        right: 10px;
        top: 16px;
        height: 14px;
        border: 2px solid #5a4024;
        border-top: 0;
        border-radius: 0 0 6px 6px;
        background: linear-gradient(#c4a574, #8a6840);
      }
      .paper {
        height: 100%;
        background:
          linear-gradient(90deg, rgba(80, 50, 20, 0.12), transparent 10px),
          linear-gradient(180deg, rgba(255, 255, 255, 0.22), transparent 16%),
          repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(80, 50, 20, 0.06) 28px),
          var(--paper);
        color: var(--ink);
        padding: 26px 18px 16px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        transform: translateZ(6px);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28);
      }
      .paper-edge {
        position: absolute;
        top: 8px;
        right: -9px;
        width: 9px;
        height: calc(100% - 16px);
        background: linear-gradient(180deg, #c8b090, #8a7050);
        transform: rotateY(86deg);
        transform-origin: left center;
      }
      .paper-date {
        font-family: 'Courier Prime', 'Noto Serif SC', monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        color: var(--ink-soft);
        margin: 0 0 12px;
      }
      .tracks {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
        scrollbar-width: thin;
        scrollbar-color: #b08960 transparent;
      }
      .track {
        display: grid;
        grid-template-columns: 1.6em 28px minmax(0, 1fr) 28px;
        gap: 8px;
        align-items: center;
        padding: 5px 0;
      }
      .rank {
        font-family: 'Courier Prime', monospace;
        font-size: 11px;
        color: var(--ink-soft);
      }
      .stamp {
        width: 28px;
        height: 28px;
        transform: rotateY(-18deg);
        box-shadow: 3px 4px 6px rgba(80, 40, 10, 0.35);
      }
      .track-title {
        font-size: 13px;
        font-weight: 700;
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .track-artist {
        font-size: 11px;
        color: var(--ink-soft);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ink {
        justify-self: end;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ink);
        opacity: 0.28;
        box-shadow: 1px 2px 0 rgba(0, 0, 0, 0.2);
      }
      .ink[data-w='2'] {
        opacity: 0.5;
        transform: scale(1.15);
      }
      .ink[data-w='3'] {
        opacity: 0.78;
        transform: scale(1.35);
      }
      .ink[data-w='4'] {
        opacity: 1;
        transform: scale(1.55);
        background: #1a140f;
      }
      .blank {
        margin: auto;
        font-size: 13px;
        color: var(--ink-soft);
        letter-spacing: 0.12em;
      }

      .shelf-stage {
        position: relative;
        z-index: 4;
        height: 210px;
        perspective: 1200px;
        transform: translateZ(28px);
      }
      .shelf-row {
        position: relative;
        height: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 28px;
        padding: 0 8% 28px;
        transform-style: preserve-3d;
      }
      .plank {
        position: absolute;
        left: 7%;
        right: 7%;
        bottom: 10px;
        height: 34px;
        transform-style: preserve-3d;
        pointer-events: none;
      }
      .plank-top {
        height: 100%;
        background: linear-gradient(180deg, #6a4a30, #3a281c 70%, #24180f);
        transform: rotateX(68deg);
        transform-origin: 50% 100%;
        box-shadow: 0 16px 28px rgba(0, 0, 0, 0.5);
      }
      .plank-front {
        position: absolute;
        left: 0;
        right: 0;
        bottom: -10px;
        height: 12px;
        background: linear-gradient(180deg, #4a3222, #1a100c);
        box-shadow: inset 0 1px 0 rgba(255, 220, 170, 0.18);
      }
      .album {
        position: relative;
        flex: 0 0 auto;
        width: var(--w);
        transform-style: preserve-3d;
        transform: rotateY(var(--ry)) rotateX(8deg) translateY(var(--ty, 0px));
        transform-origin: 50% 100%;
        transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
        z-index: var(--z);
      }
      .album:nth-child(1) {
        --w: 138px;
        --ry: -28deg;
        --ty: -14px;
        --z: 5;
      }
      .album:nth-child(2) {
        --w: 118px;
        --ry: -16deg;
        --ty: -6px;
        --z: 4;
      }
      .album:nth-child(3) {
        --w: 104px;
        --ry: -4deg;
        --z: 3;
      }
      .album:nth-child(4) {
        --w: 92px;
        --ry: 10deg;
        --z: 2;
      }
      .album:nth-child(5) {
        --w: 84px;
        --ry: 22deg;
        --z: 1;
      }
      .album:hover,
      .album:focus-visible {
        transform: rotateY(-8deg) rotateX(4deg) translateY(-28px) scale(1.06);
        z-index: 8;
      }
      .jacket {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        transform-style: preserve-3d;
      }
      .sleeve {
        position: absolute;
        inset: 0;
        transform: translateZ(8px);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
      }
      .jacket-spine {
        position: absolute;
        top: 0;
        left: 0;
        width: 14px;
        height: 100%;
        background: linear-gradient(180deg, #d8c4a0, #6a4a30 40%, #24180f);
        transform: rotateY(-90deg) translateZ(7px);
        transform-origin: left center;
        box-shadow: inset -2px 0 0 rgba(0, 0, 0, 0.35);
      }
      .jacket-right {
        position: absolute;
        top: 0;
        right: 0;
        width: 8px;
        height: 100%;
        background: linear-gradient(180deg, #2a1c14, #0e0a08);
        transform: rotateY(90deg) translateZ(4px);
        transform-origin: right center;
      }
      .vinyl {
        position: absolute;
        inset: 8%;
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 50%, #c4a574 0 8%, #111 9% 11%, #1a1a1a 12% 100%);
        box-shadow: 0 0 0 1px #000;
        transform: translateZ(-2px) translateX(18px);
        transition: transform 320ms ease;
      }
      .album:hover .vinyl,
      .album:focus-visible .vinyl {
        transform: translateZ(-2px) translateX(34px);
      }
      .sleeve-caption {
        position: absolute;
        left: -10%;
        right: -10%;
        top: calc(100% + 10px);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: color-mix(in srgb, var(--lamp) 75%, white);
        text-align: center;
        white-space: nowrap;
        opacity: 0;
        transform: translateZ(20px);
        pointer-events: none;
      }
      .album:hover .sleeve-caption,
      .album:focus-visible .sleeve-caption {
        opacity: 1;
      }

      .note {
        position: absolute;
        left: 36px;
        bottom: 18px;
        z-index: 5;
        font-size: 11px;
        letter-spacing: 0.16em;
        color: color-mix(in srgb, var(--lamp) 45%, #5a4634);
      }

      .cover-a {
        background: #1c3354;
        display: grid;
        place-items: center;
        color: #ead7a8;
        font-family: Italiana, serif;
        letter-spacing: 0.2em;
        font-size: 13px;
      }
      .cover-a span {
        border: 1px solid #ead7a8;
        padding: 8px 10px;
      }
      .cover-b {
        background: radial-gradient(circle at 30% 30%, #d8c4a0, #6b4a2a 42%, #1a120c);
      }
      .cover-c {
        background: linear-gradient(135deg, #f2efe6 50%, #c45c2a 50%);
      }
      .cover-d {
        background:
          linear-gradient(90deg, transparent 40%, rgba(0, 0, 0, 0.35) 40% 42%, transparent 42%),
          linear-gradient(#0e1c28, #163044);
      }
      .cover-e {
        background: #111;
        display: grid;
        place-items: end start;
        padding: 10px;
      }
      .cover-e i {
        width: 36%;
        aspect-ratio: 1;
        background: #f0d24a;
      }

      @media (max-width: 900px) {
        .room {
          padding: 16px 16px 12px;
        }
        .heatmap {
          height: 200px;
          gap: 3px;
        }
        .shelf-stage {
          height: 150px;
        }
        .album:nth-child(1) {
          --w: 92px;
        }
        .album:nth-child(2) {
          --w: 80px;
        }
        .album:nth-child(3),
        .album:nth-child(4),
        .album:nth-child(5) {
          --w: 68px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .stage,
        .wall-board,
        .setlist,
        .album,
        .vinyl,
        .cell,
        .clipboard {
          transition: none;
        }
        .stage {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="room is-day" id="room">
      <div class="lamp" aria-hidden="true"></div>
      <div class="stage" id="stage">
        <header class="inscription">
          <div class="plaque">
            <div class="year" id="yearLabel">2026</div>
            <div class="year-switch" role="tablist" aria-label="年份">
              <button type="button" data-year="2026" class="is-on">2026</button>
              <button type="button" data-year="2025">2025</button>
            </div>
          </div>
          <div class="census">
            <div class="genre-word" id="genreWord">JAZZ</div>
            <div class="census-line" id="censusLine">馆藏 12,480 首</div>
            <div class="spines" id="spines" aria-hidden="true"></div>
          </div>
        </header>

        <div class="field">
          <div class="wall-stage">
            <div class="wall-board" id="wall">
              <div class="wall-side" aria-hidden="true"></div>
              <div class="wall-face">
                <div class="months" id="months"></div>
                <div class="heatmap" id="grid" role="grid" aria-label="年度听音墙"></div>
              </div>
              <div class="wall-bottom" aria-hidden="true"></div>
            </div>
          </div>
          <aside class="setlist" aria-label="当天曲目单">
            <div class="clipboard">
              <div class="clip" aria-hidden="true"></div>
              <div class="paper-edge" aria-hidden="true"></div>
              <div class="paper">
                <p class="paper-date" id="paperDate"></p>
                <div class="tracks" id="tracks"></div>
              </div>
            </div>
          </aside>
        </div>

        <div class="shelf-stage">
          <div class="plank" aria-hidden="true">
            <div class="plank-top"></div>
            <div class="plank-front"></div>
          </div>
          <div class="shelf-row" id="shelf" aria-label="年度常听专辑"></div>
        </div>
      </div>
      <div class="note">声迹 · 听音室 · 合成数据 · 点亮墙上的一天</div>
    </div>

    <script>
      const YEARS = {
        2026: {
          genre: 'JAZZ',
          rgb: '196, 137, 74',
          library: '馆藏 12,480 首',
          spines: [
            ['#c4894a', 42],
            ['#7a5a38', 28],
            ['#d9c4a0', 22],
            ['#4a6a78', 18],
            ['#8a8a8a', 14],
          ],
          albums: [
            { title: '夜间练习曲', cls: 'cover-a', html: '<span>NIGHT</span>' },
            { title: '铜管与雨', cls: 'cover-b', html: '' },
            { title: '未寄出的信', cls: 'cover-c', html: '' },
            { title: 'After Hours', cls: 'cover-d', html: '' },
            { title: '室内乐小品', cls: 'cover-e', html: '<i></i>' },
          ],
          seed: 26,
          defaultDay: '2026-09-18',
        },
        2025: {
          genre: 'CLASSICAL',
          rgb: '156, 168, 184',
          library: '馆藏 11,932 首',
          spines: [
            ['#9ca8b8', 46],
            ['#d4c4a0', 26],
            ['#6a7a88', 20],
            ['#c4894a', 16],
            ['#8a8a8a', 14],
          ],
          albums: [
            { title: '冬日弦乐', cls: 'cover-e', html: '<i></i>' },
            { title: '室内光线', cls: 'cover-d', html: '' },
            { title: '练习与沉默', cls: 'cover-a', html: '<span>ADAGIO</span>' },
            { title: '北窗', cls: 'cover-b', html: '' },
            { title: '未完成的赋格', cls: 'cover-c', html: '' },
          ],
          seed: 25,
          defaultDay: '2025-12-14',
        },
      }

      const TRACK_POOL = [
        ['夜航', '岸田奏'],
        ['第二杯威士忌', 'Brass Atlas'],
        ['雨落在铜管上', '林晚'],
        ['Blue Kitchen', 'Harbor Trio'],
        ['未写完的信', '岸田奏'],
        ['Midnight Errand', 'Neon Harbor'],
        ['练习曲 No.4', 'Ensemble North'],
        ['街角的灯', '林晚'],
        ['After the Set', 'Harbor Trio'],
        ['窗', '岸田奏'],
        ['低音提琴', 'Ensemble North'],
        ['Last Call', 'Brass Atlas'],
      ]

      const grid = document.getElementById('grid')
      const months = document.getElementById('months')
      const room = document.getElementById('room')
      const tracksEl = document.getElementById('tracks')
      const paperDate = document.getElementById('paperDate')
      const shelf = document.getElementById('shelf')
      const spines = document.getElementById('spines')
      let year = 2026
      let selected = YEARS[2026].defaultDay
      let cells = []

      function rng(seed) {
        let s = seed
        return () => {
          s = (s * 16807) % 2147483647
          return (s - 1) / 2147483646
        }
      }
      function key(d) {
        const m = String(d.getMonth() + 1).padStart(2, '0')
        const day = String(d.getDate()).padStart(2, '0')
        return `${d.getFullYear()}-${m}-${day}`
      }
      function level(n) {
        if (n >= 7) return 4
        if (n >= 4) return 3
        if (n >= 2) return 2
        if (n >= 1) return 1
        return 0
      }
      function playsFor(date, rand) {
        const m = date.getMonth()
        const w = date.getDay()
        let p = 0
        if (rand() > 0.38) p = 1 + Math.floor(rand() * 3)
        if ((m === 0 || m === 8 || m === 11) && rand() > 0.35) p += 2
        if (w === 5 || w === 6) p += rand() > 0.4 ? 2 : 0
        if (rand() > 0.92) p += 5
        return Math.min(14, p)
      }

      function buildYear(y) {
        const cfg = YEARS[y]
        const rand = rng(cfg.seed * 997)
        const first = new Date(y, 0, 1)
        const days = new Date(y, 1, 29).getMonth() === 1 ? 366 : 365
        const today = new Date(2026, 8, 30)
        const map = []
        for (let i = 0; i < days; i++) {
          const d = new Date(y, 0, i + 1)
          map.push({
            date: key(d),
            label: `${d.getMonth() + 1}月${d.getDate()}日`,
            plays: d > today ? 0 : playsFor(d, rand),
            future: d > today,
            month: d.getMonth(),
          })
        }
        return { firstWeekday: first.getDay(), map }
      }

      function tracksFor(date) {
        const n = date.split('-').join('')
        const rand = rng(Number(n) || 1)
        const count = 6 + Math.floor(rand() * 5)
        const used = new Set()
        const list = []
        while (list.length < count) {
          const i = Math.floor(rand() * TRACK_POOL.length)
          if (used.has(i)) continue
          used.add(i)
          list.push({
            title: TRACK_POOL[i][0],
            artist: TRACK_POOL[i][1],
            plays: count - list.length + Math.floor(rand() * 3),
            hue: 20 + ((i * 37) % 40),
          })
        }
        return list.sort((a, b) => b.plays - a.plays).slice(0, 10)
      }

      function paintSpines(cfg) {
        spines.replaceChildren(
          ...cfg.spines.map(([color, h]) => {
            const i = document.createElement('i')
            i.style.background = `linear-gradient(180deg, ${color}, color-mix(in srgb, ${color} 40%, #1a120c))`
            i.style.height = `${Math.max(14, h)}px`
            return i
          }),
        )
      }

      function paintAlbums(cfg) {
        shelf.replaceChildren(
          ...cfg.albums.map((album, index) => {
            const b = document.createElement('button')
            b.className = 'album'
            b.type = 'button'
            b.innerHTML = `
              <div class="jacket">
                <div class="vinyl" aria-hidden="true"></div>
                <div class="jacket-spine" aria-hidden="true"></div>
                <div class="sleeve ${album.cls}">${album.html}</div>
                <div class="jacket-right" aria-hidden="true"></div>
              </div>
              <div class="sleeve-caption">${index + 1} · ${album.title}</div>`
            return b
          }),
        )
      }

      function showDay(day) {
        selected = day
        cells.forEach((c) => c.classList.toggle('is-on', c.dataset.date === day))
        if (!day) {
          room.classList.remove('is-day')
          return
        }
        room.classList.add('is-day')
        const item = current.map.find((d) => d.date === day)
        paperDate.textContent = item ? item.label : day
        tracksEl.replaceChildren()
        if (!item || item.plays === 0) {
          const blank = document.createElement('div')
          blank.className = 'blank'
          blank.textContent = item?.future ? '' : '这一天没有落下声音'
          tracksEl.append(blank)
          return
        }
        tracksFor(day).forEach((t, i) => {
          const row = document.createElement('div')
          row.className = 'track'
          const w = t.plays >= 8 ? 4 : t.plays >= 5 ? 3 : t.plays >= 3 ? 2 : 1
          row.innerHTML = `
            <span class="rank">${String(i + 1).padStart(2, '0')}</span>
            <span class="stamp" style="background:hsl(${t.hue} 28% 42%)"></span>
            <span><div class="track-title">${t.title}</div><div class="track-artist">${t.artist}</div></span>
            <span class="ink" data-w="${w}" title="${t.plays}"></span>`
          tracksEl.append(row)
        })
      }

      let current = buildYear(year)

      function render() {
        const cfg = YEARS[year]
        document.getElementById('yearLabel').textContent = String(year)
        document.getElementById('genreWord').textContent = cfg.genre
        document.getElementById('censusLine').textContent = cfg.library
        document.documentElement.style.setProperty('--room-rgb', cfg.rgb)
        paintSpines(cfg)
        paintAlbums(cfg)
        current = buildYear(year)
        const cols = Math.ceil((current.map.length + current.firstWeekday) / 7)
        grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`
        months.style.gridTemplateColumns = grid.style.gridTemplateColumns
        months.replaceChildren()
        grid.replaceChildren()
        const monthCol = Array(12).fill(-1)
        const pads = Array.from({ length: current.firstWeekday }, () => {
          const b = document.createElement('button')
          b.className = 'cell is-empty-pad'
          b.tabIndex = -1
          b.disabled = true
          return b
        })
        cells = current.map.map((day, index) => {
          if (monthCol[day.month] < 0) {
            monthCol[day.month] = Math.floor((index + current.firstWeekday) / 7) + 1
          }
          const b = document.createElement('button')
          b.type = 'button'
          b.className = 'cell'
          b.dataset.date = day.date
          b.dataset.level = String(level(day.plays))
          b.classList.toggle('is-future', day.future)
          b.disabled = day.future
          b.title = day.future ? `${day.label} · 尚未到来` : day.label
          b.setAttribute('aria-label', b.title)
          b.addEventListener('click', () => showDay(day.date))
          return b
        })
        grid.append(...pads, ...cells)
        ;['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'].forEach(
          (label, m) => {
            const s = document.createElement('span')
            s.textContent = label
            s.style.gridColumn = String(monthCol[m] || 1)
            months.append(s)
          },
        )
        const fallback = current.map.find((d) => d.date === cfg.defaultDay && !d.future)
        showDay(fallback?.date ?? current.map.filter((d) => d.plays > 0).at(-1)?.date)
      }

      document.querySelectorAll('[data-year]').forEach((btn) => {
        btn.addEventListener('click', () => {
          year = Number(btn.dataset.year)
          document.querySelectorAll('[data-year]').forEach((b) => b.classList.toggle('is-on', b === btn))
          render()
        })
      })

      grid.addEventListener('keydown', (event) => {
        const i = cells.indexOf(document.activeElement)
        if (i < 0) return
        const move = { ArrowRight: 7, ArrowLeft: -7, ArrowDown: 1, ArrowUp: -1 }[event.key]
        if (!move) return
        event.preventDefault()
        const next = cells[i + move]
        if (next && !next.disabled) next.focus()
      })

      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)')
      room.addEventListener('pointermove', (event) => {
        if (reduce.matches) return
        const x = event.clientX / window.innerWidth - 0.5
        const y = event.clientY / window.innerHeight - 0.5
        room.style.setProperty('--tilt-y', `${x * 7}deg`)
        room.style.setProperty('--tilt-x', `${-y * 4}deg`)
      })
      room.addEventListener('pointerleave', () => {
        room.style.setProperty('--tilt-y', '0deg')
        room.style.setProperty('--tilt-x', '0deg')
      })

      render()
    </script>
  </body>
</html>
