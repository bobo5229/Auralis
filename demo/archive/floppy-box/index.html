<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>声迹 · 软盘盒</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header><span>AURALIS / 声迹</span><span class="subtle">收纳交互原型</span></header>
    <main>
      <div class="toolbar">
        <h1>一盒听过的音乐。</h1>
        <button id="lid" aria-expanded="true">合上盒盖</button>
      </div>
      <nav aria-label="分类">
        <button data-group="all" aria-pressed="true">全部 <small>06</small></button
        ><button data-group="ambient" aria-pressed="false">氛围</button
        ><button data-group="jazz" aria-pressed="false">爵士</button
        ><button data-group="indie" aria-pressed="false">独立</button>
      </nav>
      <div class="viewport">
        <div class="scene" id="scene">
          <div class="ground"></div>
          <div class="case-back"></div>
          <div class="lid"><span>AURALIS</span><small>PERSONAL MUSIC ARCHIVE</small></div>
          <div class="case-side"></div>
          <div id="disks"></div>
          <div class="case-front">
            <span class="badge">声迹 / COLLECTION</span><span class="latch"></span
            ><small>3½″ · HIGH DENSITY</small>
          </div>
        </div>
      </div>
      <section class="selection" aria-label="当前软盘">
        <div>
          <p id="position"></p>
          <h2 id="title"></h2>
          <p id="artist"></p>
        </div>
        <div class="actions">
          <button id="prev" aria-label="上一张">←</button><button id="take">取出软盘</button
          ><button id="next" aria-label="下一张">→</button>
        </div>
      </section>
      <footer>
        <span>点击盘签翻找 · 方向键切换 · Enter 取出 / 放回 · Esc 归位</span
        ><span id="status" role="status">盒盖已打开</span>
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
