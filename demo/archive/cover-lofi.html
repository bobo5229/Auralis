<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声迹 · 彩色封面滤镜实验</title><style>
*{box-sizing:border-box}body{margin:0;background:#090a12;color:#d1d6e7;font:14px 'Microsoft YaHei',sans-serif}main{max-width:1500px;margin:auto;padding:36px 28px}.eyebrow{font:11px Consolas,monospace;color:#c49fbf;letter-spacing:3px}h1{font-size:26px;font-weight:500;margin:12px 0}p{color:#969db5;line-height:1.8;font-size:12px}.toolbar{display:flex;align-items:center;gap:22px;flex-wrap:wrap;border-block:1px solid #373345;margin:26px 0;padding:18px 0}button,select,.upload{background:#242030;border:1px solid #64516d;color:#d9d3e5;padding:10px 14px;font:inherit;cursor:pointer}button:hover,.upload:hover{background:#3b2b42}button[aria-pressed=true]{border-color:#ee89bd}.upload{display:inline-block}input[type=file]{position:absolute;width:1px;height:1px;opacity:0}.upload:focus-within,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #e8a1cf;outline-offset:4px}.range{display:flex;align-items:center;gap:10px}input[type=range]{accent-color:#d57faf;width:150px}.samples{display:flex;gap:8px;margin-right:auto}.samples button{padding:3px;line-height:0}.samples img{width:42px;height:42px;object-fit:cover}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{border:1px solid #343345;background:#11121d;min-width:0}.card h2{display:flex;justify-content:space-between;font-size:14px;font-weight:500;margin:0;padding:16px}.card h2 span{font:11px Consolas,monospace;color:#ad93b4}canvas{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated}.card:first-child canvas{image-rendering:auto}.meta{padding:14px 16px;min-height:84px;font:11px Consolas,'Microsoft YaHei',monospace;color:#a4acc2}.palette{display:flex;flex-wrap:wrap;margin-top:12px;gap:2px}.palette i{width:8px;height:8px}.status{min-height:22px;color:#cab7d3}.note{max-width:780px;margin-top:22px}.grid[aria-busy=true] .card:not(:first-child){opacity:.5}@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:24px 16px}}@media(max-width:480px){.grid{gap:10px}.card h2{padding:12px;font-size:12px}.meta{padding:12px;font-size:10px}.toolbar{gap:14px}.range{flex-wrap:wrap}.samples{margin-right:0}h1{font-size:22px}}
</style></head><body><main><div class="eyebrow">AURALIS / COVER SIGNAL LAB</div><h1>保留色彩，削减精度</h1><p>比较同一张封面的三档 lo-fi 处理。每张图片保留自己的主要颜色。</p><div class="toolbar"><label class="upload">选择本地封面<input id="file" type="file" accept="image/*"></label><div id="samples" class="samples" aria-label="内置摄影样图"></div><label>抖色算法 <select id="algorithm"><option value="floyd">Floyd–Steinberg</option><option value="atkinson">Atkinson</option></select></label><label class="range">抖色强度 <input id="strength" type="range" min="0" max="100" value="65"><output id="amount">65%</output></label></div><p id="status" class="status" role="status" aria-live="polite">正在准备样图…</p><div id="grid" class="grid" aria-busy="true"></div><p class="note">选择文件后在本机浏览器处理，原始图片保持不变。非正方形图片居中裁切。<br>强度为 0 时关闭抖色；提高强度会让更多细微颜色差异参与误差扩散。滤镜使用 image-q，自适应调色板与抖色均复用其实现。</p></main><script src="../albums/cd-startup-assets.js"></script><script src="./cover-lofi.bundle.js"></script></body></html>
