<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声迹 · 舞台 lo-fi 对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#030305;color:#cbd0e0;font:14px 'Microsoft YaHei',sans-serif}#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.65}main{position:relative;max-width:1500px;margin:auto;padding:40px 28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}h1{font-size:22px;font-weight:500;margin:8px 0}.eyebrow{font:11px Consolas,monospace;letter-spacing:3px;color:#b696c4}header p{color:#929bb2;font-size:12px;line-height:1.8;margin:0}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{border:1px solid #373345;background:#0b0c16bb;min-width:0}.panel-head{display:flex;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #373345;font:12px Consolas,'Microsoft YaHei',monospace}.panel-head span{color:#9a90aa}.stage-container{position:relative;aspect-ratio:800/480;overflow:hidden}.stage-source,.stage-output{position:absolute;inset:0;width:100%;height:100%;display:block}.stage-source{touch-action:none}.stage-output{pointer-events:none;image-rendering:pixelated;filter:blur(.22px)}[data-fidelity=lofi] .stage-source{opacity:0}.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 3px,#05061422 3px 4px);opacity:.3}.caption{height:48px;margin:0 15%;perspective:600px}.caption canvas{width:100%;height:48px;transform:rotateX(48deg);opacity:.8}.sr{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}.controls{display:flex;justify-content:center;align-items:center;gap:8px;padding:14px 8px 18px;font:11px Consolas,monospace}.selectors{display:flex;gap:5px}button{background:#171523;color:#cbd0e0;border:1px solid #53465c;padding:9px 12px;font:inherit;cursor:pointer}button:hover{background:#30243c}button[aria-pressed=true]{color:#ff83bc;border-color:#c65c98;background:#3a203a}button:focus-visible{outline:2px solid #d4b5ef;outline-offset:3px}.position{color:#9695b0;margin-left:4px}.foot{margin:22px 0;color:#9c9aac;font-size:12px;line-height:1.9}#replay{white-space:nowrap}@media(max-width:850px){main{padding:24px 12px}.comparison{grid-template-columns:1fr}header{align-items:flex-start;flex-wrap:wrap}.controls{gap:5px}button{padding:9px}.panel-head{font-size:11px}}@media(prefers-reduced-motion:reduce){.scan{opacity:.15}}
</style></head>
<body><canvas id="sky" aria-hidden="true"></canvas><main><header><div><div class="eyebrow">AURALIS / SIGNAL STUDY 01</div><h1>同一座舞台，两种显示语言</h1><p>保留造型与投影动作，比较材质、像素与色阶。</p></div><button id="replay">重新投影</button></header><div class="comparison"><section class="panel" id="reference" data-fidelity="reference"></section><section class="panel" id="lofi" data-fidelity="lofi"></section></div><p class="foot">左：原有材质与高清绘制。右：简化材质、320 × 192 采样、有限色阶与有序抖色。<br>两侧使用相同的色块封面；点击编号切换专辑，或用「重新投影」比较浮现过程。</p></main><script src="./night-well-background.js"></script><script src="./stage-lofi.bundle.js"></script></body></html>
