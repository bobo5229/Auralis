<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auralis · 音乐档案终端</title>
<style>
      :root {
        --putty: #d7ceba;

      * {

      .rig {
        position: relative;
