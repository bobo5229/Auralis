<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>百日留声 · 连续 100 天珐琅徽章</title>
    <link rel="stylesheet" href="../hours/gallery.css" />
    <link rel="stylesheet" href="gallery.css" />
  </head>
  <body data-state="lit" data-badge="days-100">
    <header>
      <a href="../hours/index.html">查看小时徽章</a>
      <span>Auralis · 连续天数徽章</span>
    </header>
    <main>
      <nav class="day-series" aria-label="连续天数徽章">
        <a href="index.html">7 天 · 一周相伴</a>
        <a href="30.html">30 天 · 月下相伴</a>
        <a href="100.html" aria-current="page">100 天 · 百日留声</a>
        <a href="365.html">365 天 · 一岁相伴</a>
        <a href="520.html">520 天 · 倾心相伴</a>
      </nav>
      <section class="day-showcase" aria-labelledby="badge-title">
        <a class="day-asset" href="assets/days-100.svg" aria-label="打开连续 100 天已点亮 SVG">
          <img
            id="main-badge"
            src="assets/days-100.svg"
            width="330"
            height="370"
            alt="深青珐琅徽章，银色唱针与两枚椭圆唱片音轨组成数字 100，下方为 DAYS"
          />
        </a>
        <div class="day-details">
          <h1 id="badge-title">百日留声</h1>
          <p class="day-condition">连续 100 天聆听</p>
          <p class="day-story">一支唱针，两枚音轨。<br />音乐组成了一百天。</p>
          <div class="background-control" role="group" aria-label="徽章状态">
            <button type="button" data-state="lit" aria-pressed="true">已点亮</button>
            <button type="button" data-state="unlit" aria-pressed="false">未点亮</button>
          </div>
          <p id="state-note" aria-live="polite">深青釉面 · 数字唱片 · 银色唱针</p>
          <div class="downloads">
            <a id="svg-download" href="assets/days-100.svg" download>下载 SVG</a>
            <a id="png-download" href="assets/days-100@2x.png" download>透明 PNG</a>
          </div>
          <div class="day-background">
            <span>预览背景</span>
            <div class="background-control" role="group" aria-label="预览背景">
              <button type="button" data-background="dark" aria-pressed="true">深色底</button>
              <button type="button" data-background="light" aria-pressed="false">浅色底</button>
            </div>
          </div>
        </div>
      </section>
      <section class="miniatures" aria-labelledby="small-title">
        <div>
          <h2 id="small-title">放进收藏里</h2>
          <p>96 px 实际尺寸 · 两种状态对照</p>
        </div>
        <div class="day-small-badges">
          <figure>
            <img
              src="assets/days-100.svg"
              width="96"
              height="108"
              alt="连续 100 天已点亮徽章，96 px 预览"
            />
            <figcaption>已点亮</figcaption>
          </figure>
          <figure>
            <img
              src="assets/days-100-unlit.svg"
              width="96"
              height="108"
              alt="连续 100 天未点亮徽章，96 px 预览"
            />
            <figcaption>未点亮</figcaption>
          </figure>
        </div>
      </section>
    </main>
    <footer>
      <span>透明背景 · 矢量字形 · SVG / 660 × 740 PNG</span>
      <span>连续天数系列设计原型，尚未接入播放器。</span>
    </footer>
    <script src="gallery.js"></script>
  </body>
</html>
