<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>现场回声 · 首次完整听完一张现场专辑珐琅徽章</title>
    <link rel="stylesheet" href="../hours/gallery.css" />
    <link rel="stylesheet" href="../days/gallery.css" />
  </head>
  <body data-state="lit" data-badge="albums-live">
    <header>
      <a href="../hours/index.html">查看小时徽章</a>
      <span>Auralis · 专辑徽章</span>
    </header>
    <main>
      <nav class="day-series" aria-label="徽章系列">
        <a href="../days/index.html">连续天数徽章</a><a href="index.html">首张专辑 · 从头到尾</a
        ><a href="live.html" aria-current="page">现场专辑 · 现场回声</a>
      </nav>
      <section class="day-showcase" aria-labelledby="badge-title">
        <a
          class="day-asset"
          href="assets/albums-live.svg"
          aria-label="打开首次完整听完一张现场专辑已点亮 SVG"
        >
          <img
            id="main-badge"
            src="assets/albums-live.svg"
            width="330"
            height="370"
            alt="午夜蓝舞台与酒红珐琅幕帘，中央银色复古落地麦克风，下方观众席弧线与 LIVE 铭文"
          />
        </a>
        <div class="day-details">
          <h1 id="badge-title">现场回声</h1>
          <p class="day-condition">首次完整听完一张现场专辑</p>
          <p class="day-story">幕帘拉开，回声留下。<br />把一场演出完整听进记忆里。</p>
          <div class="background-control" role="group" aria-label="徽章状态">
            <button type="button" data-state="lit" aria-pressed="true">已点亮</button>
            <button type="button" data-state="unlit" aria-pressed="false">未点亮</button>
          </div>
          <p id="state-note" aria-live="polite">酒红珐琅幕帘 · 银色立式麦克风 · 观众席弧线</p>
          <div class="downloads">
            <a id="svg-download" href="assets/albums-live.svg" download>下载 SVG</a>
            <a id="png-download" href="assets/albums-live@2x.png" download>透明 PNG</a>
          </div>
          <div class="day-background">
            <span>预览背景</span>
            <div class="background-control" role="group" aria-label="预览背景">
              <button type="button" data-background="dark" aria-pressed="true">深色底</button>
              <button type="button" data-background="light" aria-pressed="false">浅色底</button>
            </div>
          </div>
        </div>
      </section>
      <section class="miniatures" aria-labelledby="small-title">
        <div>
          <h2 id="small-title">放进收藏里</h2>
          <p>96 px 实际尺寸 · 两种状态对照</p>
        </div>
        <div class="day-small-badges">
          <figure>
            <img
              src="assets/albums-live.svg"
              width="96"
              height="108"
              alt="首次完整听完一张现场专辑已点亮徽章，96 px 预览"
            />
            <figcaption>已点亮</figcaption>
          </figure>
          <figure>
            <img
              src="assets/albums-live-unlit.svg"
              width="96"
              height="108"
              alt="首次完整听完一张现场专辑未点亮徽章，96 px 预览"
            />
            <figcaption>未点亮</figcaption>
          </figure>
        </div>
      </section>
    </main>
    <footer>
      <span>透明背景 · 矢量字形 · SVG / 660 × 740 PNG</span>
      <span>专辑系列静态设计原型，尚未接入播放器。</span>
    </footer>
    <script src="gallery.js"></script>
  </body>
</html>
