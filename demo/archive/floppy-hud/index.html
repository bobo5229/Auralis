<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>声迹 · 通高双列软盘 HUD</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stars" aria-hidden="true"></div>
    <header class="page-header">
      <span>AURALIS / 声迹</span>
      <span class="demo-note">静态视觉原型 · 演示专辑</span>
    </header>
    <main>
      <section class="hud" aria-labelledby="collection-title">
        <svg class="hud-outline" viewBox="0 0 620 800" preserveAspectRatio="none" aria-hidden="true">
          <path class="frame-shadow" d="M34 8H586L612 34V766L586 792H34L8 766V34Z" />
          <path class="frame-main" d="M34 8H586L612 34V766L586 792H34L8 766V34Z" />
          <path class="frame-inner" d="M42 20H578L600 42V758L578 780H42L20 758V42Z" />
          <path class="frame-corners" d="M8 82V34L34 8H86 M534 8H586L612 34V82 M612 718V766L586 792H534 M86 792H34L8 766V718" />
          <path class="frame-accents" d="M30 65V46L46 30H74 M546 30H574L590 46V65 M590 735V754L574 770H546 M74 770H46L30 754V735" />
          <path class="frame-breaks" d="M146 8H182 M438 8H474 M146 792H182 M438 792H474" />
        </svg>
        <header class="hud-header">
          <div class="collection-heading">
            <h1 id="collection-title">听过的专辑</h1>
            <p>当日最常听 <span>5 张</span></p>
          </div>
          <div class="date-display" aria-label="演示日期：2026年10月5日">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m10 4-4 4 4 4" /></svg>
            <span>今日 <time datetime="2026-10-05">2026年10月5日</time></span>
            <svg class="down" viewBox="0 0 16 16" aria-hidden="true"><path d="m5 6 3 3 3-3" /></svg>
            <svg class="next" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 4 4 4-4 4" /></svg>
          </div>
        </header>
        <div class="media-window">
          <ol class="disk-row" aria-label="当日专辑软盘，每行两张，第三张为静态选中示意">
            <li class="disk-cell">
              <div class="disk-media" role="img" aria-label="Windswept Adan，青葉市子">
                <span class="disk-shutter"></span>
                <span class="disk-label"><img src="../listening-journal/assets/windswept-adan.jpg" alt="" /><span class="disk-title">Windswept Adan</span></span>
              </div>
            </li>
            <li class="disk-cell">
              <div class="disk-media" role="img" aria-label="Waltz for Debby，Bill Evans Trio">
                <span class="disk-shutter"></span>
                <span class="disk-label"><img src="../listening-journal/assets/waltz-for-debby.jpg" alt="" /><span class="disk-title">Waltz for Debby</span></span>
              </div>
            </li>
            <li class="disk-cell is-selected">
              <svg class="selection-frame" viewBox="0 0 210 210" preserveAspectRatio="none" aria-hidden="true">
                <path class="select-halo" d="M16 6H194L204 16V194L194 204H16L6 194V16Z" />
                <path class="select-edge" d="M16 6H194L204 16V194L194 204H16L6 194V16Z" />
                <path class="select-corners" d="M6 44V16L16 6H44 M166 6H194L204 16V44 M204 166V194L194 204H166 M44 204H16L6 194V166" />
              </svg>
              <div class="disk-media" role="img" aria-label="已选中：Untourable Album，Men I Trust">
                <span class="disk-shutter"></span>
                <span class="disk-label"><img src="../listening-journal/assets/untourable-album.jpg" alt="" /><span class="disk-title">Untourable Album</span></span>
              </div>
            </li>
            <li class="disk-cell">
              <div class="disk-media" role="img" aria-label="Endlessness，Nala Sinephro">
                <span class="disk-shutter"></span>
                <span class="disk-label"><img src="../listening-journal/assets/endlessness.jpg" alt="" /><span class="disk-title">Endlessness</span></span>
              </div>
            </li>
            <li class="disk-cell">
              <div class="disk-media" role="img" aria-label="async，坂本龍一">
                <span class="disk-shutter"></span>
                <span class="disk-label"><img src="../listening-journal/assets/async.jpg" alt="" /><span class="disk-title">async</span></span>
              </div>
            </li>
          </ol>
        </div>
        <footer class="hud-footer">
          <div class="selected-info"><span class="selected-marker" aria-hidden="true"></span><div><h2>Untourable Album</h2><p>Men I Trust</p></div></div>
          <span class="insert-display">插入 Mac <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10h13m-5-5 5 5-5 5" /></svg></span>
        </footer>
      </section>
    </main>
  </body>
</html>
