<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auralis Music 品牌动效 Demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Segoe UI', system-ui, sans-serif;
        --surface: #171b20;
        --text: #edf0ee;
        --muted: #aeb7ba;
        --accent: #b8d8c9;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: var(--surface);
        color: var(--text);
      }

      main {
        display: grid;
        justify-items: center;
        gap: 48px;
        padding: 40px 24px;
      }

      .brand {
        display: inline-flex;
        gap: 8px;
        align-items: baseline;
        padding: 28px 20px 32px;
        color: var(--text);
        font-size: clamp(32px, 8vw, 64px);
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 1.2;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
      }

      .word {
        position: relative;
        display: inline-block;
      }

      .word--left {
        --start-x: -70px;
        --near-x: -24px;
        --over-x: 5px;
        --rebound-x: -2px;
        --second-land-x: 3px;
        --third-land-x: 1px;
        --tilt: -6deg;
      }

      .word--right {
        --start-x: 70px;
        --near-x: 24px;
        --over-x: -5px;
        --rebound-x: 2px;
        --second-land-x: -3px;
        --third-land-x: -1px;
        --tilt: 6deg;
      }

      .word::after {
        content: '';
        position: absolute;
        bottom: -6px;
        width: calc(100% + 6px);
        height: 3px;
        border-radius: 3px;
        background: var(--accent);
        opacity: 0;
        transform: scaleX(0);
      }

      .word--left::after {
        left: 0;
        transform-origin: left center;
      }

      .word--right::after {
        right: 0;
        transform-origin: right center;
      }

      .note-anchor {
        position: absolute;
        top: calc(100% - 3px);
        left: calc(100% + 4px);
        width: 0;
        height: 0;
        pointer-events: none;
      }

      .note {
        position: absolute;
        left: -12px;
        top: -12px;
        width: 24px;
        height: 24px;
        color: var(--accent);
        opacity: 0;
        transform: translateY(0) scale(0.5);
      }

      .particle {
        position: absolute;
        top: -2px;
        left: -2px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0;
      }

      .particle:nth-child(3n) {
        width: 3px;
        height: 3px;
        border-radius: 1px;
      }

      .brand.is-playing .word {
        animation: land 1100ms both;
      }

      .brand.is-playing .word::after {
        animation: meet 430ms 670ms both linear;
      }

      .brand.is-playing .note {
        animation: note-burst 980ms 1200ms both;
      }

      .brand.is-playing .particle {
        animation: scatter 510ms 1740ms both ease-out;
      }

      @keyframes land {
        0% {
          opacity: 0.45;
          transform: translate(var(--start-x), -22px) rotate(var(--tilt));
          animation-timing-function: cubic-bezier(0.25, 0.15, 0.65, 0.45);
        }
        42% {
          opacity: 1;
          transform: translate(var(--near-x), -15px) rotate(0deg);
          animation-timing-function: cubic-bezier(0.38, 0.08, 0.8, 0.72);
        }
        56% {
          transform: translate(var(--over-x), 5px);
          animation-timing-function: ease-out;
        }
        66% {
          transform: translate(var(--rebound-x), -12px);
          animation-timing-function: ease-in;
        }
        74% {
          transform: translate(var(--second-land-x), 3px);
          animation-timing-function: ease-out;
        }
        82% {
          transform: translate(var(--rebound-x), -7px);
          animation-timing-function: ease-in;
        }
        89% {
          transform: translate(var(--third-land-x), 2px);
          animation-timing-function: ease-out;
        }
        95% {
          transform: translate(0, -3px);
          animation-timing-function: ease-out;
        }
        100% {
          opacity: 1;
          transform: translate(0, 0);
        }
      }

      @keyframes meet {
        0% { opacity: 1; transform: scaleX(0); }
        100% { opacity: 1; transform: scaleX(1); }
      }

      @keyframes note-burst {
        0% { opacity: 0; transform: translateY(2px) scale(0.35) rotate(-12deg); }
        28% { opacity: 1; transform: translateY(calc(-1.2em - 22px)) scale(1.12) rotate(5deg); }
        35% { transform: translate(2px, calc(-1.2em - 22px)) scale(1) rotate(8deg); }
        42% { transform: translate(-2px, calc(-1.2em - 23px)) scale(1) rotate(-5deg); }
        50% { opacity: 1; transform: translate(1px, calc(-1.2em - 22px)) scale(1) rotate(3deg); }
        62% { opacity: 0; transform: translateY(calc(-1.2em - 22px)) scale(0.6) rotate(0deg); }
        100% { opacity: 0; transform: translateY(calc(-1.2em - 22px)) scale(0.6); }
      }

      @keyframes scatter {
        0% { opacity: 0; transform: translate(0, calc(-1.2em - 22px)) scale(0.3); }
        12% { opacity: 1; transform: translate(0, calc(-1.2em - 22px)) scale(1); }
        100% { opacity: 0; transform: translate(var(--dx), calc(-1.2em - 22px + var(--dy))) scale(0); }
      }

      .controls {
        display: grid;
        justify-items: center;
        gap: 12px;
      }

      button {
        min-width: 112px;
        padding: 10px 18px;
        border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
        border-radius: 9px;
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        color: var(--text);
        font: 600 14px/1.2 'Segoe UI', system-ui, sans-serif;
        cursor: pointer;
      }

      button:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      .hint { margin: 0; color: var(--muted); font-size: 13px; }

      @media (max-width: 540px) {
        .brand { gap: 5px; padding-inline: 0; }
        .word::after { width: calc(100% + 4px); }
        .note-anchor { left: calc(100% + 2.5px); }
        .word--left { --start-x: -36px; --near-x: -12px; }
        .word--right { --start-x: 36px; --near-x: 12px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .brand.is-playing .word { animation: none; }
        .brand.is-playing .word::after { animation: none; opacity: 1; transform: scaleX(1); }
        .brand.is-playing .note { animation: none; }
        .brand.is-playing .particle { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" id="brand" aria-label="Auralis Music">
        <span class="word word--left" aria-hidden="true">
          Auralis
          <span class="note-anchor" aria-hidden="true">
            <svg class="note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 18V4l8-2v6c0 2 1 3 2 4" />
              <ellipse cx="7" cy="18" rx="3" ry="2" transform="rotate(-20 7 18)" />
            </svg>
            <span class="particle" style="--dx:-28px;--dy:-12px"></span>
            <span class="particle" style="--dx:-20px;--dy:13px"></span>
            <span class="particle" style="--dx:-7px;--dy:-22px"></span>
            <span class="particle" style="--dx:9px;--dy:19px"></span>
            <span class="particle" style="--dx:24px;--dy:-16px"></span>
            <span class="particle" style="--dx:30px;--dy:7px"></span>
            <span class="particle" style="--dx:0px;--dy:23px"></span>
          </span>
        </span>
        <span class="word word--right" aria-hidden="true">Music</span>
      </div>
      <div class="controls">
        <button id="replay" type="button">重播动画</button>
        <p class="hint">也可以将鼠标移到品牌字上重播</p>
      </div>
    </main>
    <script>
      const brand = document.getElementById('brand')
      const replay = () => {
        brand.classList.remove('is-playing')
        void brand.offsetWidth
        brand.classList.add('is-playing')
      }

      document.getElementById('replay').addEventListener('click', replay)
      brand.addEventListener('pointerenter', replay)
      requestAnimationFrame(replay)
    </script>
  </body>
</html>
