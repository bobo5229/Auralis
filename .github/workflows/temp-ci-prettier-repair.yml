name: Temporary Prettier CI repair
on:
  push:
    branches:
      - fix/ci-prettier-20261012
    paths:
      - .github/workflows/temp-ci-prettier-repair.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run repository-pinned Prettier only on failed paths
        run: |
          npx prettier --write "src/renderer/app/styles/main.css" \
            "docs/lessons/2026-10-04-cd-browser-development-lessons.md" \
            "docs/lessons/README.md" \
            "docs/projects/library-page-orchestration/IMPLEMENTATION-REPORT.md" \
            "docs/projects/library-page-orchestration/REVIEW.md" \
            "docs/projects/library-page-orchestration/TECHDOC.md" \
            "docs/reviews/2026-10-04-open-source-reuse-audit.md" \
            "docs/topics/archive/REFERENCE-retrofuturism-design.md" \
            "docs/topics/metadata/TECHDOC-multivalue-metadata-2026-10-03.md" \
            "docs/topics/metadata/TECHDOC-playback-metadata-edit-guard-2026-09-30.md" \
            "docs/topics/playback/TECHDOC-playerbar-queue-surface-unification-2026-09-06.md" \
            "docs/topics/shell/light-theme-color-presets.md"
          npm run format:check
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "src/renderer/app/styles/main.css" "docs/lessons/2026-10-04-cd-browser-development-lessons.md" "docs/lessons/README.md" "docs/projects/library-page-orchestration/IMPLEMENTATION-REPORT.md" "docs/projects/library-page-orchestration/REVIEW.md" "docs/projects/library-page-orchestration/TECHDOC.md" "docs/reviews/2026-10-04-open-source-reuse-audit.md" "docs/topics/archive/REFERENCE-retrofuturism-design.md" "docs/topics/metadata/TECHDOC-multivalue-metadata-2026-10-03.md" "docs/topics/metadata/TECHDOC-playback-metadata-edit-guard-2026-09-30.md" "docs/topics/playback/TECHDOC-playerbar-queue-surface-unification-2026-09-06.md" "docs/topics/shell/light-theme-color-presets.md"
          if ! git diff --cached --quiet; then
            git commit -m "style: fix Prettier violations in 12 CI-reported files"
            git push
          fi
