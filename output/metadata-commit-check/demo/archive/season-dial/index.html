<!doctype html>
<html lang="zh-CN" data-theme="dark" data-season="autumn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Auralis · 季节拨盘原型</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <svg class="icon-definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></symbol>
        <symbol id="i-music" viewBox="0 0 24 24">
          <path d="M9 18V5l11-2v13M9 8l11-2" />
          <ellipse cx="6" cy="18" rx="3" ry="2.5" />
          <ellipse cx="17" cy="16" rx="3" ry="2.5" />
        </symbol>
        <symbol id="i-album" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="3" />
          <circle cx="12" cy="12" r="5" />
          <circle cx="12" cy="12" r="1" />
        </symbol>
        <symbol id="i-disc" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <circle cx="12" cy="12" r="2" />
          <path d="M7 10a5 5 0 0 1 3-3m4 10a5 5 0 0 0 3-3" />
        </symbol>
        <symbol id="i-archive" viewBox="0 0 24 24">
          <path
            d="M6 3h12a2 2 0 0 1 2 2v16H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm2 0v18m4-13h4m-4 4h4"
          />
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" />
        </symbol>
        <symbol id="i-moon" viewBox="0 0 24 24">
          <path d="M20.5 13.5A9 9 0 0 1 10.5 3.4 9 9 0 1 0 20.5 13.5Z" />
        </symbol>
        <symbol id="i-settings" viewBox="0 0 24 24">
          <path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3Z" />
          <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z" class="solid" /></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24">
          <path d="M8 5v14M16 5v14" class="pause-stroke" />
        </symbol>
        <symbol id="i-next" viewBox="0 0 24 24">
          <path d="m5 6 10 6-10 6Z" class="solid" />
          <path d="M19 6v12" />
        </symbol>
        <symbol id="i-queue" viewBox="0 0 24 24">
          <path d="M4 6h16M4 12h11M4 18h8m5-2 5 3-5 3Z" />
        </symbol>
        <symbol id="i-volume" viewBox="0 0 24 24">
          <path d="M4 9h4l5-4v14l-5-4H4Zm12-1a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" />
        </symbol>
      </defs>
    </svg>

    <div class="app-shell">
      <aside class="sidebar" aria-label="播放器侧栏示意">
        <div class="brand"><span class="brand-mark">A</span>uralis<span>Music</span></div>
        <div class="sidebar-section">资料库</div>
        <div class="nav-item">
          <svg class="icon"><use href="#i-music" /></svg>歌曲
        </div>
        <div class="nav-item">
          <svg class="icon"><use href="#i-album" /></svg>专辑
        </div>
        <div class="nav-item">
          <svg class="icon"><use href="#i-disc" /></svg>唱片室
        </div>
        <div class="nav-item selected">
          <svg class="icon"><use href="#i-archive" /></svg>聆听档案
        </div>
        <div class="sidebar-section playlist-label">
          歌单<svg class="icon"><use href="#i-plus" /></svg>
        </div>
        <div class="nav-item">
          <svg class="icon"><use href="#i-clock" /></svg>最近播放
        </div>
        <div class="nav-item">
          <svg class="icon"><use href="#i-music" /></svg>最常收听
        </div>
        <div class="sidebar-bottom">
          <span>Auralis</span><svg class="icon"><use href="#i-settings" /></svg>
        </div>
      </aside>

      <main class="main">
        <header class="page-header">
          <div class="breadcrumb">
            <span>聆听档案</span><svg class="icon"><use href="#i-chevron" /></svg><span>四季</span>
          </div>
          <div class="preview-tools">
            <span class="prototype-label">原型 · 示例数据</span>
            <button
              class="icon-button"
              id="theme-toggle"
              type="button"
              aria-label="切换为浅色主题"
              title="切换为浅色主题"
            >
              <svg class="icon"><use href="#i-sun" /></svg>
            </button>
          </div>
        </header>

        <h1 class="sr-only">四季聆听档案</h1>
        <div class="season-layout">
          <section class="dial-column" aria-label="季节选择">
            <div class="dial" id="dial" style="--dial-turn: -180deg">
              <div class="dial-pointer" aria-hidden="true"></div>
              <div class="dial-rotor" id="dial-rotor">
                <svg class="dial-art" viewBox="0 0 480 480" aria-hidden="true">
                  <defs>
                    <linearGradient id="spring-colors" x1="0" y1="1" x2="1" y2="0">
                      <stop stop-color="#72b99b" />
                      <stop offset=".56" stop-color="#c1dfc0" />
                      <stop offset="1" stop-color="#eac2c8" />
                    </linearGradient>
                    <linearGradient id="summer-colors" x1="0" y1="0" x2="1" y2="1">
                      <stop stop-color="#3ca7bb" />
                      <stop offset=".6" stop-color="#b6e2cf" />
                      <stop offset="1" stop-color="#efd593" />
                    </linearGradient>
                    <linearGradient id="autumn-colors" x1="0" y1="1" x2="1" y2="0">
                      <stop stop-color="#9f4550" />
                      <stop offset=".6" stop-color="#d98340" />
                      <stop offset="1" stop-color="#f0d599" />
                    </linearGradient>
                    <linearGradient id="winter-colors" x1="0" y1="0" x2="1" y2="1">
                      <stop stop-color="#889abf" />
                      <stop offset=".6" stop-color="#b6aacb" />
                      <stop offset="1" stop-color="#edf0f2" />
                    </linearGradient>
                  </defs>
                  <g id="dial-ticks"></g>
                  <g id="dial-arcs"></g>
                  <circle class="inner-guide" cx="240" cy="240" r="135" />
                </svg>
                <div class="season-controls" role="tablist" aria-label="季节，使用左右方向键切换">
                  <div class="season-position" style="--base-angle: 0deg">
                    <button
                      id="season-tab-0"
                      class="season-button"
                      type="button"
                      role="tab"
                      aria-controls="season-content"
                      aria-selected="false"
                      tabindex="-1"
                      data-index="0"
                    >
                      春
                    </button>
                  </div>
                  <div class="season-position" style="--base-angle: 90deg">
                    <button
                      id="season-tab-1"
                      class="season-button"
                      type="button"
                      role="tab"
                      aria-controls="season-content"
                      aria-selected="false"
                      tabindex="-1"
                      data-index="1"
                    >
                      夏
                    </button>
                  </div>
                  <div class="season-position" style="--base-angle: 180deg">
                    <button
                      id="season-tab-2"
                      class="season-button"
                      type="button"
                      role="tab"
                      aria-controls="season-content"
                      aria-selected="true"
                      tabindex="0"
                      data-index="2"
                    >
                      秋
                    </button>
                  </div>
                  <div class="season-position" style="--base-angle: 270deg">
                    <button
                      id="season-tab-3"
                      class="season-button"
                      type="button"
                      role="tab"
                      aria-controls="season-content"
                      aria-selected="false"
                      tabindex="-1"
                      data-index="3"
                    >
                      冬
                    </button>
                  </div>
                </div>
              </div>
              <div class="dial-center">
                <p class="dial-year" id="dial-year">2026</p>
                <div class="season-caption" id="season-caption">
                  <span class="season-character" id="season-character" aria-hidden="true">秋</span>
                  <p class="season-months" id="season-months">09 — 11 月</p>
                </div>
              </div>
            </div>
            <div class="dial-navigation" aria-label="顺序切换季节">
              <button
                id="previous-season"
                class="icon-button"
                type="button"
                aria-label="上一个季节"
              >
                <svg class="icon reverse"><use href="#i-chevron" /></svg>
              </button>
              <span class="season-english" id="season-english" aria-hidden="true">AUTUMN</span>
              <button id="next-season" class="icon-button" type="button" aria-label="下一个季节">
                <svg class="icon"><use href="#i-chevron" /></svg>
              </button>
            </div>
          </section>

          <section
            class="season-panel"
            id="season-content"
            role="tabpanel"
            aria-labelledby="season-tab-2"
            tabindex="0"
          >
            <header class="tracks-heading">
              <div class="tracks-heading-title">
                <h2>常听</h2>
                <span id="track-count">12 首</span>
              </div>
              <button
                type="button"
                class="play-all"
                id="play-all"
                aria-label="预览播放全部，无音频"
              >
                <svg class="icon"><use href="#i-play" /></svg>播放全部
              </button>
            </header>
            <div class="list-columns" aria-hidden="true"><span>歌曲</span><span>次数</span></div>
            <div class="track-scroll" id="track-scroll">
              <ol class="track-list" id="track-list" aria-label="本季常听歌曲"></ol>
            </div>
          </section>
        </div>

        <footer class="player" aria-label="播放栏状态预览，不播放音频">
          <div class="player-track">
            <div class="track-cover player-cover" id="player-cover" aria-hidden="true"></div>
            <div class="player-metadata">
              <span class="player-title" id="player-title">晚风经过</span
              ><span class="player-artist" id="player-artist">低空飞行</span>
            </div>
          </div>
          <div class="transport">
            <button class="icon-button" id="player-previous" type="button" aria-label="预览上一首">
              <svg class="icon reverse"><use href="#i-next" /></svg>
            </button>
            <button
              class="transport-play"
              id="player-toggle"
              type="button"
              aria-label="预览播放，无音频"
              aria-pressed="false"
            >
              <svg class="icon"><use href="#i-play" /></svg>
            </button>
            <button class="icon-button" id="player-next" type="button" aria-label="预览下一首">
              <svg class="icon"><use href="#i-next" /></svg>
            </button>
          </div>
          <div class="player-trailing" aria-hidden="true">
            <svg class="icon"><use href="#i-queue" /></svg
            ><svg class="icon"><use href="#i-volume" /></svg>
          </div>
        </footer>
        <p class="sr-only" id="announcement" role="status" aria-live="polite"></p>
      </main>
    </div>
  </body>
</html>
