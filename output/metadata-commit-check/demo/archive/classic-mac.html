<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auralis · Macintosh 128K</title>
    <style>
      :root {
        --putty: #d7ceba;
        --putty-hi: #efe7d4;
        --putty-mid: #c9c0ab;
        --putty-lo: #a89f8b;
        --putty-ink: #6f6758;
        --seam: #8f8674;
        --crt-black: #12110f;
        --studio: #030305;
        --w: 300px;
        --h: 425px;
        --d: 340px;
        --tilt-x: -16deg;
        --tilt-y: -32deg;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--studio);
        color: #d8d0c0;
      }
      body {
        overflow: hidden;
        font-family: Palatino, 'Iowan Old Style', 'Songti SC', serif;
      }
      .studio {
        position: relative;
        z-index: 1;
        height: 100%;
        display: grid;
        place-items: center;
        perspective: 1600px;
        background: transparent;
      }
      .sky-background, .sky-vignette {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }
      .sky-background { display: block; }
      .sky-vignette {
        background:
          radial-gradient(120% 90% at 50% 38%, transparent 42%, rgba(3, 3, 5, 0.55) 100%),
          linear-gradient(180deg, transparent 62%, rgba(3, 3, 5, 0.72) 100%);
      }
      .rig {
        position: relative;
        width: var(--w);
        height: var(--h);
        transform-style: preserve-3d;
        transform: translate3d(var(--move-x, 0px), var(--move-y, 0px), var(--move-z, 0px)) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) scale3d(var(--zoom, 1), var(--zoom, 1), var(--zoom, 1));
        transform-origin: 50% 50%;
        cursor: grab;
        user-select: none;
        touch-action: none;
        outline: none;
      }
      .rig.is-transitioning {
        will-change: transform;
      }
      .rig.is-dragging { cursor: grabbing; }
      .rig:focus-visible {
        outline: 2px solid var(--putty-hi);
        outline-offset: 18px;
      }
      .screen-mode .rig {
        cursor: default;
      }
      /* The recessed CRT sits behind the front shell in 3D hit testing. */
      .screen-mode .mac {
        pointer-events: none;
      }
      .screen-mode .crt-glass,
      .screen-mode .bezel-key {
        pointer-events: auto;
      }
      .kbd, .mouse, .shadow, .caption, .hint, .bezel-key {
        transition: opacity 450ms ease;
      }
      .screen-mode .kbd, .screen-mode .mouse, .screen-mode .shadow,
      .screen-mode .caption, .screen-mode .hint {
        opacity: 0;
        pointer-events: none;
      }
      .mac,
      .kbd,
      .mouse {
        position: absolute;
        transform-style: preserve-3d;
      }
      .mac {
        inset: 0;
      }
      .face {
        position: absolute;
        background: var(--putty-mid);
        backface-visibility: hidden;
      }
      .front,
      .back {
        width: var(--w);
        height: var(--h);
        left: 0;
        top: 0;
      }
      .front {
        transform: translateZ(calc(var(--d) / 2));
        background: none;
        transform-style: preserve-3d;
      }
      .front-top,
      .front-left,
      .front-right,
      .front-chin {
        position: absolute;
        background: linear-gradient(180deg, var(--putty-hi) 0%, var(--putty) 40%, var(--putty-mid) 100%);
      }
      .front-top {
        left: 0;
        right: 0;
        top: 0;
        height: 9%;
      }
      .front-left {
        left: 0;
        top: 9%;
        width: 11%;
        height: 37%;
        transform-style: preserve-3d;
      }
      .front-right {
        right: 0;
        top: 9%;
        width: 11%;
        height: 37%;
        transform-style: preserve-3d;
      }
      .bezel-key {
        position: absolute;
        z-index: 2;
        width: 11px;
        height: 11px;
        padding: 0;
        border: 0;
        border-radius: 1px;
        background: linear-gradient(180deg, #f3ece0, #c9c0ad);
        box-shadow:
          0 1px 0 #8a8272,
          inset 0 1px 0 rgba(255, 255, 255, 0.7);
        color: var(--putty-ink);
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transform: translateZ(1px);
      }
      #bezel-return {
        top: auto;
        right: 3px;
        bottom: 22px;
        left: auto;
      }
      #bezel-power {
        top: auto;
        left: 3px;
        bottom: 22px;
        right: auto;
      }
      .bezel-key svg {
        display: block;
        width: 7px;
        height: 7px;
        margin: 2px auto 0;
      }
      .screen-mode .bezel-key {
        opacity: 1;
      }
      .bezel-key:hover:not(:disabled) {
        background: linear-gradient(180deg, #f7f1e6, #d2c8b4);
      }
      .bezel-key:active:not(:disabled),
      .bezel-key[aria-pressed='true'] {
        background: linear-gradient(180deg, #c9c0ad, #b4aa96);
        box-shadow:
          inset 0 1px 2px rgba(0, 0, 0, 0.22),
          0 1px 0 rgba(255, 255, 255, 0.22);
      }
      .bezel-key:disabled {
        cursor: default;
      }
      .bezel-key:focus-visible {
        outline: 1px dotted #315b91;
        outline-offset: 1px;
      }
      .front-chin {
        left: 0;
        right: 0;
        top: 46%;
        bottom: 0;
        background: linear-gradient(180deg, var(--putty) 0%, var(--putty-mid) 100%);
      }
      .back {
        transform: rotateY(180deg) translateZ(calc(var(--d) / 2));
        background:
          linear-gradient(180deg, var(--putty-lo), #8a8270 55%, #7a7262);
      }
      .side {
        width: var(--d);
        height: var(--h);
        top: 0;
        left: calc((var(--w) - var(--d)) / 2);
      }
      .left {
        transform: rotateY(-90deg) translateZ(calc(var(--w) / 2));
        background: linear-gradient(90deg, var(--putty-hi), var(--putty-mid) 40%, var(--putty-lo));
      }
      .right {
        transform: rotateY(90deg) translateZ(calc(var(--w) / 2));
        background: linear-gradient(90deg, var(--putty-lo), #9a917e);
      }
      .cap {
        width: var(--w);
        height: var(--d);
        left: 0;
        top: calc((var(--h) - var(--d)) / 2);
      }
      .top {
        transform: rotateX(90deg) translateZ(calc(var(--h) / 2));
        background: linear-gradient(180deg, var(--putty-hi), var(--putty));
      }
      .bottom {
        transform: rotateX(-90deg) translateZ(calc(var(--h) / 2));
        background: #8a8170;
      }
      .seam-line {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        right: 28%;
        background: linear-gradient(180deg, transparent, var(--seam) 8%, var(--seam) 92%, transparent);
        box-shadow: 1px 0 0 rgba(255, 245, 220, 0.18);
      }
      .vents {
        position: absolute;
        inset: 42px 22px 90px;
        background: repeating-linear-gradient(
          90deg,
          #5c564a 0 3px,
          #2e2b26 3px 7px
        );
        box-shadow: inset 0 8px 16px rgba(0, 0, 0, 0.45);
      }
      .rear-plate {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 28px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        color: #3f3a32;
        font-size: 11px;
        letter-spacing: 0.16em;
      }
      .ports {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 14px;
        height: 18px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .ports i {
        display: block;
        height: 10px;
        background: #1c1a16;
        box-shadow: inset 0 1px 2px #000, 0 1px 0 rgba(255, 255, 255, 0.12);
      }
      .ports i:nth-child(1) {
        width: 28px;
      }
      .ports i:nth-child(2) {
        width: 36px;
      }
      .ports i:nth-child(3) {
        width: 22px;
      }
      .ports i:nth-child(4) {
        width: 14px;
        border-radius: 50%;
        height: 14px;
      }

      .handle {
        position: absolute;
        left: 28px;
        right: 28px;
        bottom: 28px;
        height: 52px;
        transform-style: preserve-3d;
        transform: translateZ(10px);
        pointer-events: none;
      }
      .handle-well {
        position: absolute;
        inset: 0;
        background: #2a261f;
        box-shadow:
          inset 0 10px 16px rgba(0, 0, 0, 0.55),
          inset 0 -6px 10px rgba(0, 0, 0, 0.35);
        transform: translateZ(-14px);
      }
      .handle-bar {
        position: absolute;
        left: 10px;
        right: 10px;
        top: 14px;
        height: 22px;
        background: linear-gradient(180deg, var(--putty-hi), var(--putty-lo));
        box-shadow:
          0 8px 10px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
        transform: translateZ(10px);
      }

      .crt-well {
        position: absolute;
        left: 11%;
        right: 11%;
        top: 9%;
        height: 37%;
        padding: 10px 12px 12px;
        background: #0c0b0a;
        box-shadow: inset 0 0 0 2px #2e2923;
        transform: translateZ(-18px);
        transform-style: preserve-3d;
      }
      .crt-wall {
        position: absolute;
        background: #070706;
      }
      .crt-wall.n {
        left: 8px;
        right: 8px;
        top: 8px;
        height: 16px;
        transform: rotateX(-90deg);
        transform-origin: top;
      }
      .crt-wall.s {
        left: 8px;
        right: 8px;
        bottom: 8px;
        height: 16px;
        transform: rotateX(90deg);
        transform-origin: bottom;
      }
      .crt-wall.w {
        top: 8px;
        bottom: 8px;
        left: 8px;
        width: 16px;
        transform: rotateY(90deg);
        transform-origin: left;
      }
      .crt-wall.e {
        top: 8px;
        bottom: 8px;
        right: 8px;
        width: 16px;
        transform: rotateY(-90deg);
        transform-origin: right;
      }
      .crt-glass {
        position: relative;
        transform: translateZ(0);
        height: 100%;
        overflow: hidden;
        background: #efe9d8;
        box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.22);
      }
      .crt-glass #crt {
        display: block;
        pointer-events: none;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .crt-fx {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        pointer-events: none;
        visibility: hidden;
      }
      .crt-fx.is-live {
        visibility: visible;
      }
      .crt-fx canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
        image-rendering: auto;
      }
      .crt-fx #crt-noise {
        image-rendering: pixelated;
      }
      .crt-blank {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: var(--crt-black);
        opacity: 1;
      }
      .scan,
      .glare {
        z-index: 2;
      }
      .crt-entry-layer {
        position: absolute;
        z-index: 3;
        inset: 0;
        pointer-events: none;
      }
      .crt-entry {
        position: absolute;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: transparent;
        font: inherit;
        appearance: none;
        pointer-events: auto;
        cursor: pointer;
      }
      .crt-entry:disabled {
        pointer-events: none;
        cursor: default;
      }
      .crt-entry:focus-visible {
        outline: 2px dotted #315b91;
        outline-offset: -5px;
        box-shadow: inset 0 0 0 1px rgba(49, 91, 145, 0.42);
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .scan {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(rgba(20, 16, 12, 0) 50%, rgba(20, 16, 12, 0.16) 50%);
        background-size: 100% 2px;
        opacity: 0.55;
      }
      .glare {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          165deg,
          rgba(255, 255, 255, 0.22) 0%,
          transparent 32%,
          transparent 100%
        );
      }

      .floppy {
        position: absolute;
        left: 38%;
        width: 42%;
        top: 64%;
        height: 14px;
        transform-style: preserve-3d;
      }
      .floppy-lip {
        position: absolute;
        inset: 0;
        background: #1b1915;
        box-shadow:
          inset 0 3px 4px #000,
          0 1px 0 rgba(255, 255, 255, 0.2);
      }
      .floppy-depth {
        position: absolute;
        left: 2px;
        right: 2px;
        top: 3px;
        height: 18px;
        background: linear-gradient(#111, #2c2a26);
        transform: rotateX(-72deg);
        transform-origin: top;
      }
      .apple {
        position: absolute;
        left: 18%;
        top: 62.5%;
        width: 34px;
        height: 40px;
        filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.25));
      }
      .dial {
        position: absolute;
        z-index: 2;
        width: 14px;
        height: 14px;
        right: 28%;
        bottom: 11%;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #cfc6b2, #6a6356);
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.4),
          0 1px 2px rgba(0, 0, 0, 0.4);
        cursor: pointer;
        color: inherit;
      }
      .dial::after {
        content: '';
        position: absolute;
        inset: -10px;
      }
      .dial[aria-pressed='true'] {
        background: radial-gradient(circle at 35% 30%, #ddd4c0, #4f4a40);
        box-shadow:
          inset 0 2px 3px rgba(0, 0, 0, 0.45),
          0 1px 0 rgba(255, 255, 255, 0.2);
        cursor: default;
      }
      .dial:disabled {
        cursor: default;
      }
      .dial:focus-visible {
        outline: 1px dotted #315b91;
        outline-offset: 3px;
      }
      .screen-mode .dial {
        pointer-events: none;
      }
      .jack {
        position: absolute;
        right: 12%;
        bottom: 10%;
        width: 18px;
        height: 10px;
        background: #1a1814;
        border-radius: 1px;
        box-shadow: inset 0 2px 3px #000;
      }

      .kbd {
        --kw: 320px;
        --kh: 22px;
        --kd: 108px;
        width: var(--kw);
        height: var(--kh);
        left: calc((var(--w) - var(--kw)) / 2);
        top: calc(var(--h) + 20px);
        transform: translateZ(calc(var(--d) / 2 + 78px)) rotateX(-32deg);
      }
      .kbd-f,
      .kbd-bk {
        width: var(--kw);
        height: var(--kh);
        left: 0;
        top: 0;
      }
      .kbd-f {
        transform: translateZ(calc(var(--kd) / 2));
        background: linear-gradient(180deg, var(--putty-mid), var(--putty-lo));
      }
      .kbd-bk {
        transform: rotateY(180deg) translateZ(calc(var(--kd) / 2));
        background: var(--putty-lo);
      }
      .kbd-t {
        width: var(--kw);
        height: var(--kd);
        left: 0;
        top: calc((var(--kh) - var(--kd)) / 2);
        transform: rotateX(90deg) translateZ(calc(var(--kh) / 2));
        background: linear-gradient(180deg, var(--putty-hi), var(--putty));
        padding: 10px 12px;
        display: grid;
        gap: 4px;
        align-content: start;
      }
      .kbd-s {
        width: var(--kd);
        height: var(--kh);
        top: 0;
        left: calc((var(--kw) - var(--kd)) / 2);
      }
      .kbd-s.l {
        transform: rotateY(-90deg) translateZ(calc(var(--kw) / 2));
        background: var(--putty-hi);
      }
      .kbd-s.r {
        transform: rotateY(90deg) translateZ(calc(var(--kw) / 2));
        background: var(--putty-lo);
      }
      .kbd-row {
        display: flex;
        gap: 4px;
      }
      .key {
        height: 13px;
        flex: 1;
        background: linear-gradient(180deg, #f3ece0, #c9c0ad);
        box-shadow:
          0 1px 0 #8a8272,
          inset 0 1px 0 rgba(255, 255, 255, 0.7);
      }
      .key.space {
        flex: 4.6;
      }

      .mouse {
        --mw: 48px;
        --mh: 24px;
        --md: 70px;
        width: var(--mw);
        height: var(--mh);
        left: 338px;
        top: calc(var(--h) + 22px);
        transform: translateZ(calc(var(--d) / 2 + 20px));
      }
      .mouse-f {
        width: var(--mw);
        height: var(--mh);
        left: 0;
        top: 0;
        transform: translateZ(calc(var(--md) / 2));
        background: var(--putty-lo);
      }
      .mouse-t {
        width: var(--mw);
        height: var(--md);
        left: 0;
        top: calc((var(--mh) - var(--md)) / 2);
        transform: rotateX(90deg) translateZ(calc(var(--mh) / 2));
        background: linear-gradient(180deg, #e7dfcc, #c2b9a4);
      }
      .mouse-t::after {
        content: '';
        position: absolute;
        left: 8px;
        right: 8px;
        top: 8px;
        height: 24px;
        border-bottom: 1px solid rgba(80, 70, 55, 0.35);
      }
      .mouse-s {
        width: var(--md);
        height: var(--mh);
        top: 0;
        left: calc((var(--mw) - var(--md)) / 2);
      }
      .mouse-s.l {
        transform: rotateY(-90deg) translateZ(calc(var(--mw) / 2));
        background: var(--putty-hi);
      }
      .mouse-s.r {
        transform: rotateY(90deg) translateZ(calc(var(--mw) / 2));
        background: #9a917e;
      }

      /* Soften projected edges on individual surfaces; preserve the 3D
         containers and the deliberately pixelated CRT content. */
      .mac > .face:not(.front),
      .front-top, .front-left, .front-right, .front-chin,
      .kbd > .face, .mouse > .face {
        box-shadow: 0 0 0.7px 0.25px rgba(215, 206, 186, 0.55);
      }
      .handle-well, .floppy-lip, .floppy-depth, .jack {
        filter: blur(0.45px);
        border-radius: 0.8px;
      }
      .handle-bar, .crt-wall, .vents, .seam-line, .ports i {
        filter: blur(0.3px);
      }
      .key {
        filter: blur(0.22px);
        border-radius: 0.6px;
      }
      .mouse-t::after { filter: blur(0.3px); }

      .shadow {
        position: absolute;
        left: -80px;
        right: -120px;
        top: 390px;
        height: 90px;
        background: radial-gradient(ellipse at 50% 40%, rgba(0, 0, 0, 0.5), transparent 68%);
        transform: rotateX(90deg) translateZ(-40px);
        pointer-events: none;
      }

      .caption {
        position: absolute;
        left: 36px;
        bottom: 28px;
        z-index: 4;
        pointer-events: none;
      }
      .caption strong {
        display: block;
        font-size: 22px;
        font-weight: 400;
        letter-spacing: 0.08em;
      }
      .caption span {
        display: block;
        margin-top: 6px;
        font-size: 13px;
        letter-spacing: 0.18em;
        color: #8a8274;
      }
      .hint {
        position: absolute;
        right: 36px;
        bottom: 28px;
        font-size: 12px;
        letter-spacing: 0.16em;
        color: #b9ae99;
      }

      @media (max-width: 800px) {
        .studio {
          perspective: 1200px;
        }
        .hint { right: 24px; bottom: 22px; letter-spacing: .04em; }
        .caption { left: 24px; bottom: 22px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .rig.is-transitioning { transition: none; }
        .kbd, .mouse, .shadow, .caption, .hint, .bezel-key { transition: none; }
      }
    </style>
  </head>
  <body>
    <canvas class="sky-background" id="sky" aria-hidden="true"></canvas>
    <div class="sky-vignette" aria-hidden="true"></div>
    <div class="studio" id="studio">
      <div class="rig" id="rig" role="group" tabindex="0" aria-label="Macintosh 128K。双击或按 Enter、空格放大屏幕。">
        <div class="shadow" aria-hidden="true"></div>
        <div class="mac" aria-label="Macintosh 128K 立体模型">
          <div class="face front">
            <div class="front-top"></div>
            <div class="front-left">
              <button class="bezel-key" id="bezel-return" type="button" aria-label="返回整机" tabindex="-1">
                <svg viewBox="0 0 12 12" aria-hidden="true">
                  <path d="M9 2.5v4.5H3.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="square" stroke-linejoin="miter" />
                  <path d="M5.4 5.4 3.3 7l2.1 1.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="square" stroke-linejoin="miter" />
                </svg>
              </button>
            </div>
            <div class="front-right">
              <button class="bezel-key" id="bezel-power" type="button" aria-label="开机" aria-pressed="false" disabled>
                <svg viewBox="0 0 12 12" aria-hidden="true">
                  <path d="M6 1.8v4.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="square" />
                  <path d="M3.6 3.4a3.3 3.3 0 1 0 4.8 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="square" />
                </svg>
              </button>
            </div>
            <div class="front-chin"></div>
            <div class="crt-well">
              <div class="crt-wall n"></div>

            { opacity: NOISE_START_OPACITY, offset: 0, easing: 'linear' },
            { opacity: 0.46, offset: 0.18, easing: 'linear' },
            { opacity: 0.42, offset: 0.4, easing: 'ease-out' },
            { opacity: 0.18, offset: 0.55, easing: 'ease-out' },
            { opacity: 0.08, offset: 0.7, easing: 'ease-out' },
            { opacity: 0.03, offset: 0.85, easing: 'ease-out' },
            { opacity: 0, offset: 1 },
          ], timing),
        ]
        startNoiseLoop(gen)
        Promise.all(denoiseAnims.map(anim => anim.finished.catch(() => {}))).then(() => {
          if (gen !== transitionGen || mode !== 'screen') return
          finishScreenOn(gen)
        })
      }

      function finishScreenOn(gen) {
        if (gen !== transitionGen || mode !== 'screen') return
        crtPowered = true
        syncCrt()
        setBlank(0)
        clearDenoise()
        pauseSky(false)
        rig.classList.remove('is-transitioning')
        syncBezel()
        setEntriesReady(true)
        startRotation()
      }

      function settleNow() {
        const wasDenoising = denoiseLive
        const waiting = mode === 'screen' && !crtPowered && !wasDenoising && !motion.matches
        transitionGen += 1
        viewAnimation?.cancel()
        viewAnimation = null
        clearDenoise()
        pauseSky(false)
        rig.classList.remove('is-transitioning')
        if (mode === 'screen' && (wasDenoising || crtPowered || motion.matches)) {
          crtPowered = true
          setBlank(0)
        } else {
          setBlank(crtPowered ? 0 : 1)
        }
        layout()
        syncBezel()
        setEntriesReady(mode === 'screen')
        startRotation()
      }

      function layout() {
        const focused = mode === 'screen'
        const chromeX = well.offsetLeft + glass.offsetLeft
        const frontW = glass.offsetWidth + chromeX * 2
        let scale = focused
          ? Math.min((innerWidth - 96) / frontW, (innerHeight - 80) / glass.offsetHeight)
          : Math.min((innerWidth - 48) / 660, (innerHeight - 110) / 760, 1)
        if (focused) {
          const dpr = devicePixelRatio || 1
          scale = Math.max(1 / glass.offsetWidth, Math.floor(glass.offsetWidth * scale * dpr) / (glass.offsetWidth * dpr))
        }
        const centerX = well.offsetLeft + glass.offsetLeft + glass.offsetWidth / 2
        const centerY = well.offsetTop + glass.offsetTop + glass.offsetHeight / 2
        rig.style.setProperty('--zoom', scale)
        rig.style.setProperty('--move-x', `${focused ? (rig.offsetWidth / 2 - centerX) * scale : 0}px`)
        rig.style.setProperty('--move-y', `${focused ? (rig.offsetHeight / 2 - centerY) * scale : -12}px`)
        rig.style.setProperty('--move-z', `${focused ? -170 * scale : 0}px`)
        rig.style.setProperty('--tilt-x', `${focused ? 0 : pitch}deg`)
        rig.style.setProperty('--tilt-y', `${yaw}deg`)
        if (focused) prepareCrt(scale)
      }

      function frame(time) {
        const elapsed = lastTime ? Math.min(time - lastTime, 250) : 0
        lastTime = time
        if (time >= pauseUntil) {
          yaw += elapsed * 360 / 60000
          rig.style.setProperty('--tilt-y', `${yaw}deg`)
        }
        raf = requestAnimationFrame(frame)
      }

      function stopRotation() { cancelAnimationFrame(raf); raf = 0; lastTime = 0 }
      function startRotation() {
        if (mode !== 'machine' || drag || transitionBusy() || motion.matches || document.hidden || raf) return
        raf = requestAnimationFrame(frame)
      }
      function pauseSky(active) {
        document.dispatchEvent(new CustomEvent('mac-view-transition', { detail: { active } }))
      }
      function powerOnMachine() {
        if (mode !== 'machine' || crtPowered || viewAnimation) return
        crtPowered = true
        drawCrt()
        setBlank(0)
        syncBezel()
      }

      function powerOn() {
        if (mode !== 'screen' || crtPowered || viewAnimation || denoiseLive || motion.matches) return
        drawCrt()
        armDenoise()
        setBlank(0)
        pauseSky(true)
        syncBezel()
        startDenoise(transitionGen)
      }

      function setMode(next) {
        if (mode === next) return
        endDrag()
        stopRotation()
        const before = getComputedStyle(rig).transform
        const gen = ++transitionGen
        viewAnimation?.cancel()
        viewAnimation = null
        clearDenoise()
        pauseSky(true)
        mode = next
        if (next === 'machine') pitch = -16
        yaw = Math.round(yaw / 360) * 360 + (next === 'machine' ? -32 : 0)
        rig.classList.add('is-transitioning')
        studio.classList.toggle('screen-mode', next === 'screen')
        rig.tabIndex = next === 'screen' ? -1 : 0
        if (next === 'screen' && motion.matches) crtPowered = true
        setEntriesReady(false)
        if (next === 'screen') drawCrt()
        setBlank(crtPowered ? 0 : 1)
        layout()
        const after = getComputedStyle(rig).transform
        if (next === 'screen') bezelReturn.focus({ preventScroll: true })
        else rig.focus({ preventScroll: true })
        const duration = motion.matches ? 0 : (next === 'screen' ? VIEW_IN_MS : VIEW_OUT_MS)
        const animation = rig.animate([{ transform: before }, { transform: after }], {
          duration,
          easing: next === 'screen' ? 'cubic-bezier(0.4, 0, 0.2, 1)' : 'cubic-bezier(0.16, 1, 0.3, 1)',
        })
        viewAnimation = animation
        syncBezel()
        animation.finished.then(() => {
          if (gen !== transitionGen || viewAnimation !== animation) return
          viewAnimation = null
          rig.classList.remove('is-transitioning')
          pauseSky(false)
          if (next === 'screen' && !crtPowered) {
            setBlank(1)
            syncBezel()
            bezelPower.focus({ preventScroll: true })
            return
          }
          if (next === 'screen') {
            finishScreenOn(gen)
            return
          }
          setBlank(crtPowered ? 0 : 1)
          syncBezel()
          startRotation()
        }).catch(() => {})
      }
      rig.addEventListener('dblclick', event => {
        if (event.button === 0 && performance.now() >= suppressDoubleClickUntil) { event.preventDefault(); setMode('screen') }
      })
      function endDrag(event) {
        if (!drag || (event && event.pointerId !== drag.id)) return
        const ended = drag
        drag = null
        rig.classList.remove('is-dragging')
        if (rig.hasPointerCapture(ended.id)) rig.releasePointerCapture(ended.id)
        if (ended.moved) suppressDoubleClickUntil = performance.now() + 400
        pauseUntil = performance.now() + 1500
        startRotation()
      }
      rig.addEventListener('pointerdown', event => {
        if (event.button !== 0 || mode !== 'machine' || transitionBusy() || drag) return
        stopRotation()
        drag = { id: event.pointerId, x: event.clientX, y: event.clientY, yaw, pitch, moved: false }
        rig.setPointerCapture(event.pointerId)
        rig.classList.add('is-dragging')
        event.preventDefault()
      })
      rig.addEventListener('pointermove', event => {
        if (!drag || event.pointerId !== drag.id) return
        const dx = event.clientX - drag.x
        const dy = event.clientY - drag.y
        if (!drag.moved && Math.hypot(dx, dy) < 4) return
        drag.moved = true
        yaw = drag.yaw + dx * 0.45
        pitch = Math.max(-55, Math.min(35, drag.pitch - dy * 0.3))
        rig.style.setProperty('--tilt-y', `${yaw}deg`)
        rig.style.setProperty('--tilt-x', `${pitch}deg`)
      })
      rig.addEventListener('pointerup', endDrag)
      rig.addEventListener('pointercancel', endDrag)
      rig.addEventListener('lostpointercapture', endDrag)
      addEventListener('blur', () => endDrag())
      rig.addEventListener('keydown', event => {
        if (event.target !== rig) return
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); setMode('screen') }
      })
      for (const button of entryButtons) {
        button.addEventListener('click', event => {
          event.stopPropagation()
          selectEntry(button.dataset.entry)
        })
        button.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') event.stopPropagation()
        })
      }
      glass.addEventListener('click', event => {
        if (!entriesReady || mode !== 'screen' || event.target.closest('.crt-entry')) return
        if (selectedEntry === null) return
        selectedEntry = null
        for (const button of entryButtons) button.setAttribute('aria-pressed', 'false')
        syncCrt()
      })
      bezelReturn.addEventListener('click', event => {
        event.stopPropagation()
        setMode('machine')
      })
      bezelPower.addEventListener('click', event => {
        event.stopPropagation()
        powerOn()
      })
      bodyPower.addEventListener('pointerdown', event => event.stopPropagation())
      bodyPower.addEventListener('click', event => {
        event.stopPropagation()
        powerOnMachine()
      })
      for (const button of [bezelReturn, bezelPower, bodyPower]) {
        button.addEventListener('dblclick', event => event.stopPropagation())
        button.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') event.stopPropagation()
        })
      }
      addEventListener('keydown', event => { if (event.key === 'Escape') setMode('machine') })
      addEventListener('resize', () => {
        endDrag()
        settleNow()
      })
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          settleNow()
          stopRotation()
          return
        }
        updateClock()
        pauseSky(false)
        setEntriesReady(mode === 'screen')
        syncBezel()
        startRotation()
      })
      motion.addEventListener('change', () => {
        settleNow()
        stopRotation()
        startRotation()
      })
      ensureNoiseFrames()
      layout()
      syncBezel()
      startRotation()
    </script>
  </body>
</html>
