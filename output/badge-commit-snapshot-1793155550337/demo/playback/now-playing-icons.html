    <style>
      :root {
        color-scheme: light;
        --bg: #f6f6f4;
        --text: #292929;
        --line: #deded9;
        --size: 16px;
      }
      :root.dark {
        color-scheme: dark;
        --bg: #242628;
        --text: #e6e4de;
        --line: #44474a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 40px auto;
        padding: 0 20px;
        max-width: 760px;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
      }
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin: 24px 0;
      }
      button,
      select {
        font: inherit;
        padding: 5px 10px;
        color: inherit;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .row {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        min-height: 76px;
        border-top: 1px solid var(--line);
      }
      .icon {
        width: var(--size);
        height: var(--size);
        justify-self: center;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg {
        width: 100%;
        height: 100%;
        fill: currentColor;
        overflow: visible;
      }
      .name {
        font-weight: 600;
      }
      .note,
      footer {
        font-size: 12px;
        opacity: 0.65;
      }
      a {
        color: inherit;
      }
      .current {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 2px;
        width: 14px;
        height: 14px;
        transform: scale(var(--scale, 1.142857));
        transform-origin: center;
      }
      .current i {
        display: block;
        width: 2px;
        height: 12px;
        background: currentColor;
        border-radius: 1px;
        transform-origin: bottom;
      }
      .ellipsis {
        position: relative;
        width: 80px;
        height: 80px;
        flex-shrink: 0;
        transform: scale(var(--ellipsis-scale, 0.2));
      }
      :root.stopped .icon *,
      :root.stopped .icon {
        animation-play-state: paused !important;
      }
      footer {
        margin-top: 24px;
      }
      @media (max-width: 480px) {
        body {
          margin-top: 24px;
        }
        .row {
          gap: 8px;
        }
      }
    </style>

    <script>
      const root = document.documentElement
      let playing = true
      const motion = matchMedia('(prefers-reduced-motion: reduce)')
      const animations = [...document.querySelectorAll('.current i')].map((bar, index) => {
        const spec = [
          { duration: 800, peak: 0.5 },
          { duration: 1050, peak: 0.3 },
          { duration: 900, peak: 0.7 },

        return bar.animate(
          [
            { transform: 'scaleY(.333)', offset: 0 },
            { transform: 'scaleY(1)', offset: spec.peak },
            { transform: 'scaleY(.333)', offset: 1 },
          ],
          { duration: spec.duration, easing: 'ease-in-out', iterations: Infinity },
        )
      })
      function sync() {
        const stopped = !playing || motion.matches || document.hidden
        root.classList.toggle('stopped', stopped)
        animations.forEach((animation) => (stopped ? animation.pause() : animation.play()))
        document
          .querySelectorAll('svg')
          .forEach((svg) => (stopped ? svg.pauseAnimations() : svg.unpauseAnimations()))
        document.querySelector('#play').textContent = playing ? '暂停' : '播放'
        document.querySelector('#play').setAttribute('aria-pressed', String(playing))
      }
      document.querySelector('#play').onclick = () => {
        playing = !playing
        sync()
      }
      document.querySelector('#theme').onclick = (event) => {
        const dark = root.classList.toggle('dark')
        event.currentTarget.textContent = dark ? '浅色' : '深色'
        event.currentTarget.setAttribute('aria-pressed', String(dark))
      }
      document.querySelector('#size').onchange = (event) => {
        const size = Number(event.target.value)
        root.style.setProperty('--size', size + 'px')
        root.style.setProperty('--scale', size / 14)
        root.style.setProperty('--ellipsis-scale', size / 80)
      }
      motion.addEventListener('change', sync)
      document.addEventListener('visibilitychange', sync)
      sync()
    </script>
  </body>
</html>
